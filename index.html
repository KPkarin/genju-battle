/* ---- AI ---- */
function aiChoose(){
  const f = FOE(), y = YOU();
  const usable = f.moves.filter(k => f.en >= enCost(f, k) && !moveBlocked(f, k));
  // 交代判断: 今の相手に2倍を取られていて、控えに有利な子がいる
  if(!isBound(f) && rng() < .35 && eff(y.type, f.type) > 1){
    const cand = B.foe.map((u,i)=>({u,i}))
      .filter(o => !o.u.dead && o.i !== B.fi && eff(y.type, o.u.type) <= 1
                   && o.u.moves.some(k => MOVES[k].p>0 && eff(MOVES[k].t, y.type) > 1));
    if(cand.length) return {kind:"switch", to:pick(cand).i};
  }
  if(f.encore) return {kind:"move", key:f.encore.key};   // 強制。出せなければ不発
  if(!usable.length) return {kind:"move", key:null};
  // 撃ちたい大技が気力不足で撃てないなら、溜めて次に備えることがある
  const wanted = f.moves.filter(k => MOVES[k].p >= 80 && enCost(f,k) > f.en);
  if(wanted.length && f.en < 40 && f.hp > f.maxhp*0.3 && rng() < .45)
    return {kind:"move", key:null};
  const lowHp = f.hp / f.maxhp;
  let best = null, bestV = -1;
  usable.forEach(k=>{
    const m = MOVES[k];
    let v;
    if(m.p > 0){
      v = m.p * eff(m.t, y.type) * (m.acc||100)/100;
      if(m.t === f.type) v *= 1.5;               // タイプ一致補正
      if(m.en > f.en * 0.7) v *= 0.8;            // 気力を使い切るのは渋る
    } else if(m.fx === "heal"){
      v = lowHp < .45 ? 240 : 10;
    } else if(m.fx === "guard"){
      v = (lowHp < .3 ? 90 : 15) * (enCost(f,k) > f.en*0.6 ? 0.3 : 1);
    } else if(m.fx === "atkup"){
      v = lowHp > .7 ? 85 : 20;
    } else if(m.fx === "seedfx"){
      v = (y.seedTurns > 0 || y.type === "草") ? 3 : 100;
    } else if(m.fx === "burnsure"){
      v = (y.status || y.type === "炎") ? 3 : 90;
    } else if(m.fx === "rootup"){
      v = lowHp > .5 ? 55 : 15;
    } else if(m.fx === "soar"){
      v = f.rank.eva >= 2 ? 10 : 60;
    } else if(m.fx === "ambush"){
      // 相手が攻撃してくる方が多いので、そこそこ期待値は高い
      v = m.p * eff(m.t, y.type) * 0.75;
    } else if(m.fx === "startle"){
      v = m.p * eff(m.t, y.type) * 0.35;
    } else if(m.fx === "counter"){
      // 選択時点では被弾するか分からない。耐えられる体力があるときだけ狙う
      v = lowHp > .35 ? 65 : 15;
    } else if(m.fx === "hzRock" || m.fx === "hzSand"){
      const key = m.fx === "hzRock" ? "rock" : "sand";
      const fresh = B.you.filter(u=>!u.dead).length;      // 相手の控えが多いほど価値が高い
      v = B.hazard.you[key] ? 3 : 55 + fresh*18;
    } else if(m.fx === "hzClear"){
      v = (B.hazard.foe.rock || B.hazard.foe.sand) ? 80 : 3;
    } else if(m.fx === "sub"){
      v = (f.sub > 0 || f.hp <= f.maxhp/4) ? 3 : (lowHp > .6 ? 95 : 25);
    } else if(m.fx === "repose"){
      v = (lowHp < .45 || f.status) ? 200 : 5;
    } else if(m.fx === "haze"){
      const setup = Math.max(y.rank.atk, y.rank.def, y.rank.spd, y.rank.eva);
      v = setup >= 2 ? 120 : 5;
    } else if(m.fx === "bond"){
      v = lowHp < .3 ? 130 : 5;
    } else if(m.fx === "perish"){
      v = f.perish ? 3 : 70;
    } else if(m.fx === "pivot"){
      v = m.p * eff(m.t, y.type) * 1.1;
    } else if(m.fx === "swapitem"){
      if(abilOff(f)) v = 140;                                   // 仮面を押し付けたい
      else if(f.equip === "none" && y.equip !== "none") v = 75;
      else if(y.equip === "none" && f.equip !== "none") v = 5;
      else v = 40;
    } else if(m.fx === "encore"){
      v = (!y.lastMove || y.encore) ? 3 : (MOVES[y.lastMove].p === 0 ? 130 : 55);
    } else if(m.fx === "disable"){
      v = (!y.lastMove || y.disabled) ? 3 : 70;
    } else if(m.fx === "taunt"){
      v = y.tauntTurns > 0 ? 3 : 65;
    } else if(m.fx === "bind"){
      v = isBound(y) ? 8 : 85;
    } else {
      v = 45;
    }
    v *= 0.85 + rng()*0.3;
    if(v > bestV){ bestV = v; best = k; }
  });
  return {kind:"move", key:best};
}

/* ---- turn resolution ---- */
/* 自分の選択を確定させ、相手の選択と突き合わせてターンを解決する */
async function resolve(myAct){
  if(B.over || B.busy) return;
  lockCmd();
  let opAct;
  if(NET.on){
    NET.send({t:"act", turn:B.turn, act:myAct});
    waitingMsg("相手の入力を待っています…");
    opAct = await NET.wait("act:"+B.turn);
    if(!opAct) return;                       // 切断
    clearWaiting();
  } else {
    opAct = aiChoose();
  }
  await takeTurn(myAct, opAct);
}

async function takeTurn(myAct, opAct){
  // 内部処理は常にホスト視点(you)で行う
  const playerAct = ME === "you" ? myAct : opAct;
  const foeAct    = ME === "you" ? opAct : myAct;

  // 1. 交代は先に処理
  if(playerAct.kind === "switch"){
    const out = YOU();
    say(`${nm(out)} を引っ込めた。`);
    leaveField(out).forEach(t => say(`<span class="sys">${out.name} ${t}</span>`));
    B.yi = playerAct.to;
    say(`ゆけ、${nm(YOU())}！`);
    paint(true); await sleep(400);
    await applyHazards(YOU());
    onEnter(YOU());
    paint();
  }
  if(foeAct.kind === "switch"){
    const out = FOE();
    say(`${nm(out)} が引っ込んだ。`);
    leaveField(out).forEach(t => say(`<span class="sys">相手の${out.name} ${t}</span>`));
    B.fi = foeAct.to;
    say(`${nm(FOE())} が現れた！`);
    paint(true); await sleep(400);
    await applyHazards(FOE());
    onEnter(FOE());
    paint();
  }

  // このターンの被ダメ記録と、選択した技の記録をリセット
  YOU().dmgTaken = 0; FOE().dmgTaken = 0;
  YOU().actionCancelled = false; FOE().actionCancelled = false;
  YOU().plannedMove = playerAct.kind === "move" ? playerAct.key : null;
  FOE().plannedMove = foeAct.kind    === "move" ? foeAct.key    : null;

  // 2. 行動順。行動は「決めた瞬間に場にいた個体」に紐づける
  const acts = [];
  if(playerAct.kind === "move") acts.push({unit:YOU(), side:"you", key:playerAct.key});
  if(foeAct.kind === "move")    acts.push({unit:FOE(), side:"foe", key:foeAct.key});
  await markFaints();          // 設置で交代先が倒れることがある
  if(B.over) return;

  const pri = k => k ? (MOVES[k].pri || 0) : 0;
  acts.sort((a,b)=>{
    const dp = pri(b.key) - pri(a.key);
    if(dp !== 0) return dp;                       // 守るなどの先制技が先
    const d = SPD(b.unit) - SPD(a.unit);
    return d !== 0 ? d : (rng()<.5?-1:1);
  });

  for(const a of acts){
    if(B.over) break;
    // 倒れた個体、および場から下がった個体の行動は消える
    if(a.unit.dead || active(a.side) !== a.unit) continue;
    const target = a.side === "you" ? FOE() : YOU();
    if(target.dead) continue;
    await doMove(a.unit, target, a.key);
    await markFaints();
  }

  if(B.over) return;

  // 3. ターン終了処理
  await endTurn();
  await markFaints();          // やけど・寄生でターン終了時に倒れる場合がある
  if(B.over) return;

  // 4. 交代要員はここで初めて場に出る（同ターン中に殴られない）
  await sendReplacements();
  if(B.over) return;

  B.turn++;
  B.busy = false;
  paint(); renderCmd();
}

/* 同じ属性の状態異常は効かない。炎はやけど、雷は麻痺、草は寄生を受け付けない */
const STATUS_IMMUNE = {"やけど":"炎", "麻痺":"雷"};

const RANK_LABEL = {atk:"攻撃", def:"防御", acc:"命中", spd:"素早さ", eva:"回避"};

/* 能力ランクを下げる。鏡膜での無効化と反骨での反撃をここに集約する。
   source を渡すと「相手による低下」として扱う（自分で下げる技は対象外）。 */
function lowerRank(target, key, n, source){
  const byFoe = source && source !== target;
  if(byFoe && target.sub > 0){ say(`${nm(target)} の身代わりが守った。`); return false; }
  if(byFoe && hasVs(target,"mirror",source)){
    say(`${nm(target)} の鏡膜が能力低下を防いだ！`);
    return false;
  }
  if(target.rank[key] <= -6){ say("これ以上は下がらない。"); return false; }
  target.rank[key] = Math.max(-6, target.rank[key] - n);
  say(`${nm(target)} の${RANK_LABEL[key]}が${n>1?"がくんと":""}下がった。`);
  if(byFoe && hasVs(target,"spite",source) && target.rank.atk < 6){
    target.rank.atk++;
    say(`${nm(target)} は反骨で攻撃が上がった！`);
  }
  return true;
}

/* 技の追加効果の抽選。好機なら発動率2倍 */
function rollFx(u, target, m){
  let pr = m.pr;
  if(has(u,"tempo") && SPD(u) > SPD(target)) pr *= 2;
  return rng() < pr;
}

/* 場に出たときの特性 */
function onEnter(u){
  if(u.equip === "bell" && !u.bellUsed && u.status){
    u.bellUsed = true;
    say(`${nm(u)} の癒しの鈴が鳴り、${u.status}が治った。`);
    u.status = null; u.statusTurns = 0;
  }
  const foe = u.side === "you" ? FOE() : YOU();
  if(has(u,"pressure") && foe && !foe.dead){
    say(`${nm(u)} の威圧！`);
    lowerRank(foe, "atk", 1, u);
  }
}

const HAZARD_NAME = {rock:"岩棘", sand:"痺れ砂"};

/* 場に出てきた個体に設置が作用する。戦闘開始時の初手には効かない */
async function applyHazards(u){
  const hz = B.hazard[u.side];
  if(!hz || u.dead) return;
  if(hz.rock){
    const e = eff("岩", u.type);
    if(e > 0){
      const d = Math.max(1, Math.floor(u.maxhp/8 * e));
      if(!indirect(u, d, "岩棘")){ paint(); return; }
      flash(u.side); spark(u.side, "岩", 9); popDmg(u.side, "-"+d, "#bab2a4");
      say(`${nm(u)} は岩の棘に傷ついた (-${d})`
        + (e>1 ? ' <span class="good">効果はばつぐんだ！</span>' : e<1 ? ' <span class="bad">効果はいまひとつ</span>' : ""));
      paint(); await sleep(520);
    }
  }
  if(hz.sand){
    // 空は踏まない。雷技が通らないタイプ（地）も電流が流れず無効
    if(u.type === "空") say(`${nm(u)} は宙に浮いていて痺れ砂を踏まない。`);
    else if(eff("雷", u.type) === 0) say(`${nm(u)} には電流が流れない。`);
    else if(inflict(u, "麻痺")){
      say(`${nm(u)} は痺れ砂で麻痺した！`);
      paint(); await sleep(520);
    }
  }
}

/* 状態異常は1個だけ。既にかかっていれば上書きしない */
function inflict(u, st){
  if(u.sub > 0 || u.status || u.hp <= 0) return false;
  if(STATUS_IMMUNE[st] === u.type) return false;
  u.status = st; u.statusTurns = 0; return true;
}

/* 変化技の効果が相手に通らないか（コマンドの「効果なし」表示にも使う） */
function fxNullified(m, target){
  if(m.fx === "burnsure") return target.type === "炎" || !!target.status;
  if(m.fx === "seedfx")   return target.type === "草" || target.seedTurns > 0;
  return false;
}

async function doMove(u, target, key){
  if(u.actionCancelled){
    u.actionCancelled = false;
    say(`${nm(u)} は怯んで ${MOVES[key].n} を出せなかった！`);
    await sleep(500); return;                 // 気力は消費しない
  }
  if(u.restTurns > 0){
    u.restTurns--;
    say(`${nm(u)} は静養の反動で動けない。`);
    await sleep(500); return;
  }
  if(u.flinch){ u.flinch=false; say(`${nm(u)} はひるんで動けない！`); await sleep(500); return; }
  if(u.status === "麻痺" && rng() < PARA_FAIL){ say(`${nm(u)} は痺れて動けない！`); await sleep(500); return; }
  if(!key){
    u.guardStreak = 0;                       // 守る以外を挟んだ扱い。lastMove は保持する
    const gain = has(u,"focus2") ? EN_FOCUS*2 : EN_FOCUS;
    u.en = Math.min(u.maxen, u.en + gain);
    say(`${nm(u)} は息を整えた (+${gain})`);
    paint(); await sleep(450); return;
  }

  // 選んだ後に相手から制限をかけられた場合、このターンの行動もその影響を受ける。
  // 反響は「上書き」、挑発と封技は「不発」。いずれも気力は消費しない。
  if(u.encore && u.encore.key !== key){
    say(`${nm(u)} は反響に引きずられた！`);
    key = u.encore.key;
  }
  const m = MOVES[key];

  if(u.tauntTurns > 0 && m.p === 0){
    say(`${nm(u)} は挑発に気を取られ ${m.n} を出せなかった！`);
    await sleep(500); return;
  }
  if(u.disabled && u.disabled.key === key){
    say(`${nm(u)} は ${m.n} を封じられていて出せなかった！`);
    await sleep(500); return;
  }
  if(EQUIPS[u.equip].lock && u.lastMove === key){
    // 反響で強制された技が連続禁止と噛み合わず、何もできない
    say(`${nm(u)} は ${EQUIPS[u.equip].n} のせいで ${m.n} を続けられず、何もできなかった！`);
    await sleep(560); return;
  }
  if(u.en < enCost(u, key)){
    say(`${nm(u)} は気力が足りず ${m.n} を出せなかった！`);
    await sleep(500); return;
  }

  u.en -= enCost(u, key);
  u.lastMove = key;                          // 外しても「使った」扱い
  if(m.fx !== "guard") u.guardStreak = 0;   // 守る以外を挟めば連続扱いは切れる
  say(`${nm(u)} の ${m.n}！`);
  await sleep(360);

  if(m.acc){
    // 命中ランク - 相手の回避ランク。回避を上げる技はまだ無いが、足せば自動で効く
    const stage = Math.max(-6, Math.min(6, u.rank.acc - target.rank.eva));
    const blur = hasVs(target,"blur",u) ? 0.9 : 1;               // 見切り
    if(rng()*100 > m.acc * accMul(stage) * blur){
      playFx(u, target, m, "miss");
      say("しかし外れた。"); await sleep(450); return;
    }
  }

  if(m.fx === "ambush"){
    const t = target.plannedMove;
    if(!t || MOVES[t].p <= 0){
      say(`しかし ${nm(target)} は攻撃してこなかった。不意打ちは失敗した。`);
      await sleep(500); return;
    }
  }
  if(m.fx === "startle"){
    const t = target.plannedMove;
    if(!t || MOVES[t].p > 0){
      say(`しかし ${nm(target)} は変化技を使わなかった。おどかすは失敗した。`);
      await sleep(500); return;
    }
    target.actionCancelled = true;
    say(`${nm(target)} は ${MOVES[t].n} をくじかれた！`);
  }

  if(m.fx === "counter"){
    if(u.dmgTaken <= 0){
      say("しかし 何も返せなかった。");
      await sleep(450); return;
    }
    const taken = u.dmgTaken;
    let d = Math.max(1, Math.floor(taken * 1.5));
    if(target.guarding) d = Math.max(1, Math.floor(d * 0.2));
    playFx(u, target, m, "attack");
    await sleep(180);
    const dealtC = Math.min(d, Math.max(0, target.hp));
    hurt(target, d);
    target.dmgTaken += dealtC;
    flash(target.side); popDmg(target.side, "-"+d, "#e9e5d8");
    say(`${nm(u)} は受けた ${taken} を ${d} にして返した！`);
    if(target.guarding) say(`${nm(target)} は守りに徹していた。`);
    if(target.equip === "thorn" && target.hp > 0){
      const t = Math.max(1, Math.floor(target.maxhp*.05));
      hurt(u, t); flash(u.side); popDmg(u.side, "-"+t, "#b58cf0");
      say(`毒棘が ${nm(u)} を刺した (-${t})`);
    }
    paint(); await sleep(560); return;
  }

  if(m.p > 0){
    playFx(u, target, m, "attack");
    await sleep(180);
    const r = damage(u, target, m);
    if(r.e === 0){
      say(`${nm(target)} には 効果がないようだ…`);
      paint(); await sleep(560); return;
    }
    if(target.sub > 0){
      const absorbed = Math.min(target.sub, r.dmg);
      target.sub -= absorbed;
      flash(target.side); popDmg(target.side, "-"+absorbed, "#a8b0cc");
      say(`${nm(target)} の身代わりが ${absorbed} を肩代わりした。`);
      if(target.sub <= 0) say(`${nm(target)} の身代わりは壊れた！`);
      if(has(u,"glutton") && u.hp < u.maxhp){
        const h = Math.max(1, Math.floor(absorbed*.15));
        u.hp = Math.min(u.maxhp, u.hp+h); popDmg(u.side,"+"+h,"#63c07d");
      }
      if(m.fx === "drain"){
        const h = Math.max(1, Math.floor(absorbed * m.dr));
        u.hp = Math.min(u.maxhp, u.hp+h); popDmg(u.side,"+"+h,"#63c07d");
      }
      paint(); await sleep(560); return;        // 身代わりの裏には何も届かない
    }
    // 計算上のダメージではなく、実際に削れた分を基準にする。
    // 残りHPを超えた過剰分で吸収・反動・仕返しが伸びないようにするため。
    const dealt = Math.min(r.dmg, Math.max(0, target.hp));
    hurt(target, r.dmg);
    target.dmgTaken += dealt;
    flash(target.side); popDmg(target.side, "-"+r.dmg, r.e>1?"#ffd66b":r.e<1?"#9aa2c4":"#fff");
    paint();
    if(r.crit) say("急所に当たった！");
    if(r.e > 1) say('<span class="good">効果はばつぐんだ！</span>');
    if(r.e < 1) say('<span class="bad">効果はいまひとつのようだ。</span>');
    if(target.guarding) say(`${nm(target)} は守りに徹していた。`);

    if(has(u,"glutton") && dealt > 0 && u.hp < u.maxhp){
      const h = Math.max(1, Math.floor(dealt*.15));
      u.hp = Math.min(u.maxhp, u.hp+h);
      popDmg(u.side, "+"+h, "#63c07d");
      say(`${nm(u)} は貪食で体力を得た (+${h})`);
    }
    if(m.fx === "drain"){
      const h = Math.max(1, Math.floor(dealt * m.dr));
      u.hp = Math.min(u.maxhp, u.hp+h);
      say(`${nm(u)} は体力を吸い取った (+${h})`);
      popDmg(u.side, "+"+h, "#63c07d");
    }
    if(m.fx === "endrain" && target.hp > 0){
      const g = Math.min(15, target.en);
      target.en -= g;
      u.en = Math.min(u.maxen, u.en + g);
      say(`${nm(target)} は気力を ${g} 奪われた。`);
    }
    if(m.fx === "recoil"){
      const t = Math.max(1, Math.floor(dealt/3));
      if(indirect(u, t, "反動")){ flash(u.side); popDmg(u.side, "-"+t, "#ff9450");
        say(`${nm(u)} は反動を受けた (-${t})`); }
    }
    if(target.equip === "thorn" && target.hp > 0){
      const t = Math.max(1, Math.floor(target.maxhp*.05));
      if(indirect(u, t, "毒棘")){ flash(u.side); popDmg(u.side, "-"+t, "#b58cf0");
        say(`毒棘が ${nm(u)} を刺した (-${t})`); }
    }
    if(m.fx === "para" && rollFx(u, target, m) && inflict(target, "麻痺")){
      say(`${nm(target)} は麻痺した！`);
    }
    if(m.fx === "burn" && rollFx(u, target, m) && inflict(target, "やけど")){
      say(`${nm(target)} はやけどを負った！`);
    }
    if(m.fx === "accdownfx" && rollFx(u, target, m) && target.hp>0){
      lowerRank(target, "acc", 1, u);
    }
    if(m.fx === "spddown" && rollFx(u, target, m) && target.hp>0){
      lowerRank(target, "spd", 1, u);
    }
    if(m.fx === "flinch" && rollFx(u, target, m) && target.hp>0){
      target.flinch = true;
    }
    if(m.fx === "defdown" && target.hp>0){
      lowerRank(target, "def", 1, u);
    }
    if(m.fx === "startle" && target.hp>0){
      lowerRank(target, "atk", 1, u);
    }
  } else {
    playFx(u, target, m, (m.fx === "heal" || m.fx === "repose") ? "heal" : "status");
    await sleep(200);
    if(m.fx === "heal"){
      const h = Math.floor(u.maxhp*.35);
      u.hp = Math.min(u.maxhp, u.hp+h);
      popDmg(u.side, "+"+h, "#63c07d");
      say(`${nm(u)} は体力を回復した (+${h})`);
    }
    if(m.fx === "guard"){
      u.guarding = true; u.guardStreak++;
      say(`${nm(u)} は身を固めた。`);
      const next = MOVES.guard.en * Math.pow(2, u.guardStreak);
      if(next <= u.maxen) say(`<span class="sys">次に続けて守るなら気力 ${next} が要る。</span>`);
      else say(`<span class="sys">これ以上は続けて守れない。</span>`);
    }
    if(m.fx === "rootup"){
      if(u.rank.def < 6) u.rank.def++;
      if(u.rank.spd > -6) u.rank.spd--;     // 自分で下げる分は鏡膜・反骨の対象外
      say(`${nm(u)} は地面に根を張った。防御が上がり、素早さが下がった。`);
    }
    if(m.fx === "soar"){
      if(u.rank.eva < 6) u.rank.eva++;
      if(u.rank.spd < 6) u.rank.spd++;
      say(`${nm(u)} は高く舞い上がった。回避と素早さが上がった！`);
    }
    if(m.fx === "sub"){
      const cost = Math.floor(u.maxhp/4);
      if(u.sub > 0) say("しかし すでに身代わりがいる。");
      else if(u.hp <= cost) say("しかし 体力が足りなかった。");
      else { hurt(u, cost); u.sub = cost; popDmg(u.side,"-"+cost,"#a8b0cc");
        say(`${nm(u)} は身代わりを立てた！（耐久 ${cost}）`); }
    }
    if(m.fx === "repose"){
      const h = Math.floor(u.maxhp*.5);
      u.hp = Math.min(u.maxhp, u.hp+h); popDmg(u.side,"+"+h,"#63c07d");
      say(`${nm(u)} は静養した (+${h})`);
      if(u.status){ say(`${nm(u)} の${u.status}は治った。`); u.status = null; u.statusTurns = 0; }
      u.restTurns = 1;
      say(`<span class="sys">${u.name} は次のターン動けない。</span>`);
    }
    if(m.fx === "haze"){
      [YOU(), FOE()].forEach(x=>{ x.rank = {atk:0,def:0,acc:0,spd:0,eva:0}; });
      say("白い霧が満ちた。両者の能力変化が元に戻った。");
    }
    if(m.fx === "bond"){
      u.bond = true;
      say(`${nm(u)} は相手を道連れにしようとしている！`);
    }
    if(m.fx === "perish"){
      let any = false;
      [u, target].forEach(x=>{ if(!x.perish){ x.perish = 3; any = true; } });
      say(any ? "滅びの唄が響いた！ 3ターン後、唄を聞いた者は倒れる。" : "しかし すでに唄は響いている。");
    }
    if(m.fx === "swapitem"){
      if(u.equip === "none" && target.equip === "none") say("しかし 交換するものがなかった。");
      else {
        const mine = u.equip, theirs = target.equip;
        u.equip = theirs; target.equip = mine;
        const nameOf = k => k === "none" ? "何も持たない状態" : EQUIPS[k].n;
        say(`${nm(u)} は持ち物を入れ替えた！`);
        say(`<span class="sys">${u.name} → ${nameOf(theirs)} ／ ${target.side==="foe"?"相手の":""}${target.name} → ${nameOf(mine)}</span>`);
        if(abilOff(target)) say(`${nm(target)} の ${ABILITIES[target.ability].n} は封じられた！`);
        if(abilOff(u))      say(`${nm(u)} の ${ABILITIES[u.ability].n} は封じられた！`);
      }
    }
    if(m.fx === "encore"){
      const t = target.lastMove;
      if(target.sub > 0) say(`${nm(target)} の身代わりが反響を防いだ。`);
      else if(!t) say("しかし 失敗した。相手はまだ技を使っていない。");
      else if(target.encore) say("しかし すでに反響がかかっている。");
      else {
        target.encore = {key:t, turns:3};
        say(`${nm(target)} は ${MOVES[t].n} の反響に囚われた！`);
      }
    }
    if(m.fx === "disable"){
      const t = target.lastMove;
      if(target.sub > 0) say(`${nm(target)} の身代わりが封技を防いだ。`);
      else if(!t) say("しかし 失敗した。相手はまだ技を使っていない。");
      else if(target.disabled) say("しかし すでに封技がかかっている。");
      else {
        target.disabled = {key:t, turns:3};
        say(`${nm(target)} の ${MOVES[t].n} は封じられた！`);
      }
    }
    if(m.fx === "taunt"){
      if(target.sub > 0) say(`${nm(target)} の身代わりが挑発を防いだ。`);
      else if(target.tauntTurns > 0) say("しかし すでに挑発されている。");
      else { target.tauntTurns = 3; say(`${nm(target)} は挑発に乗った！ 3ターン変化技が出せない。`); }
    }
    if(m.fx === "hzRock" || m.fx === "hzSand"){
      const key = m.fx === "hzRock" ? "rock" : "sand";
      const hz = B.hazard[target.side];
      if(hz[key]) say("しかし すでに設置されている。");
      else {
        hz[key] = true;
        say(`${nm(u)} は相手の足元に ${HAZARD_NAME[key]} を撒いた！`);
      }
    }
    if(m.fx === "hzClear"){
      const hz = B.hazard[u.side];
      const had = Object.keys(hz).filter(k=>hz[k]);
      if(!had.length) say("しかし 吹き飛ばすものがなかった。");
      else {
        had.forEach(k=> hz[k] = false);
        say(`${nm(u)} は ${had.map(k=>HAZARD_NAME[k]).join("と")} を吹き飛ばした！`);
      }
    }
    if(m.fx === "burnsure"){
      if(inflict(target, "やけど")) say(`${nm(target)} はやけどを負った！`);
      else if(target.type === "炎") say(`${nm(target)} には 効果がないようだ…`);
      else say("しかし 効果がなかった。");
    }
    if(m.fx === "bind"){
      lowerRank(target, "spd", 1, u);
      if(target.sub > 0) say(`${nm(target)} の身代わりが渦を防いだ。`);
      else if(isBound(target)) say("すでに渦に捕らえられている。");
      else {
        target.bindTurns = BIND_TURNS; target.boundBy = u;
        say(`${nm(target)} は渦に巻かれた！ ${BIND_TURNS}ターン交代できない。`);
      }
    }
    if(m.fx === "seedfx"){
      if(target.sub > 0) say(`${nm(target)} の身代わりが種を防いだ。`);
      else if(target.type === "草") say(`${nm(target)} には 効果がないようだ…`);
      else if(target.seedTurns > 0) say("しかし 効果がなかった。");
      else {
        target.seedTurns = SEED_TURNS;
        say(`${nm(target)} に種が植え付けられた！`);
      }
    }
    if(m.fx === "atkup"){
      if(u.rank.atk < 6){ u.rank.atk++; say(`${nm(u)} の攻撃が上がった！`); }
      else say("これ以上は上がらない。");
    }
    if(m.fx === "accdown") lowerRank(target, "acc", 1, u);
  }
  paint();
  await sleep(560);

  // 翻し: 攻撃したあと控えと入れ替わる
  if(m.fx === "pivot" && !u.dead && !B.over){
    const team = u.side === "you" ? B.you : B.foe;
    const alive = team.map((x,i)=>({x,i})).filter(o=>!o.x.dead && o.x !== u);
    if(!alive.length) say(`<span class="sys">${u.name} は入れ替わる相手がいない。</span>`);
    else {
      leaveField(u).forEach(t => say(`<span class="sys">${u.side==="foe"?"相手の":""}${u.name} ${t}</span>`));
      const to = await decideSwitch(u.side, B.pickSeq++, alive, "翻しで入れ替わる相手を選んでください");
      if(u.side === "you") B.yi = to; else B.fi = to;
      const now = u.side === "you" ? YOU() : FOE();
      say(`${nm(u)} は身を翻し、${nm(now)} と入れ替わった！`);
      paint(true); await sleep(450);
      await applyHazards(now);
      if(!now.dead) onEnter(now);
      paint(); await sleep(300);
    }
  }
}

/* 倒れた個体に印をつけるだけ。交代要員はまだ出さない */
async function markFaints(){
  for(const u of [YOU(), FOE()]){
    if(u.hp <= 0 && !u.dead){
      // 護りの札は「HP50%以上から倒されたとき」だけ発動する。
      // 条件を満たさなければ使用済みにはならず、次の機会に持ち越す。
      if(u.equip === "charm" && !u.charmUsed && u.preHitHp >= u.maxhp*0.5){
        u.charmUsed = true; u.hp = 1;
        say(`<span class="good">護りの札が</span> ${nm(u)} <span class="good">を踏みとどまらせた！</span>`);
        paint(); await sleep(600); continue;
      }
      u.dead = true; u.hp = 0;
      sprite(u.side).classList.add("faint");  // 交代要員が出るまで伏せたまま
      say(`${nm(u)} <span class="${u.side==='you'?'bad':'good'}">は倒れた！</span>`);
      paint(); await sleep(700);
      if(u.bond){
        const killer = u.side === "you" ? FOE() : YOU();
        if(killer && !killer.dead){
          killer.dead = true; killer.hp = 0;
          sprite(killer.side).classList.add("faint");
          say(`${nm(u)} は ${nm(killer)} を道連れにした！`);
          paint(); await sleep(700);
        }
      }
    }
  }
  if(B.you.every(u=>u.dead)) finish("foe");
  else if(B.foe.every(u=>u.dead)) finish("you");
}

/* 交代要員の選択UI。選ばれるまで待つ */
function chooseReplacement(title){
  return new Promise(resolve=>{
    const cmd = $("#cmd"), bench = $("#bench");
    bench.innerHTML = "";
    cmd.innerHTML = "";
    const foeUp = !OP().dead;
    cmd.appendChild(el("div","wide count", title ||
      (foeUp ? `次に出すモンスターを選んでください（相手は ${FOE().name} ${FOE().type}）`
             : "次に出すモンスターを選んでください")));
    myTeam().forEach((u,i)=>{
      if(u.dead) return;
      let tag = "";
      if(foeUp){
        const dmgMoves = OP().moves.filter(k=>MOVES[k].p>0).map(k=>eff(MOVES[k].t,u.type));
        const worst = Math.max(...dmgMoves, 0);
        tag = worst > 1 ? '<span class="eff dn">弱点を突かれる</span>'
            : worst === 0 ? '<span class="eff up">攻撃が通らない</span>' : "";
      }
      const b = el("button",null,
        `<span class="mv"><span class="mvn">${chip(u.type)} ${u.name}</span>
         <span class="mvd">HP ${Math.ceil(u.hp)}/${u.maxhp} ・ 気力 ${Math.floor(u.en)}${u.status?" ・ "+u.status:""}${u.seedTurns>0?" ・ 寄生残"+u.seedTurns:""} ・ ${eqLine(u)}</span></span>${tag}`);
      b.onclick = ()=>{ cmd.innerHTML = ""; resolve(i); };
      cmd.appendChild(b);
    });
  });
}

/* ターン終了後、倒れた枠に交代要員を出す。
   相手より先に自分が選ぶ ＝ 相手の交代先は見えない（対人戦と同じ条件） */
async function sendReplacements(){
  // 設置で出た直後に倒れることがあるので、落ち着くまで繰り返す
  for(let guard = 0; guard < 6; guard++){
    if(B.over) return;
    if(!(await sendOnce())) return;
    await markFaints();
  }
}

/* 交代先の決定。自分の担当なら選択UI、相手の担当なら通信待ち、ソロならAI。
   seq は両端末で必ず同じ順に振られるので、待ち合わせがずれない。 */
async function decideSwitch(side, seq, alive, title){
  if(alive.length === 1) return alive[0].i;
  if(side === ME){
    const i = await chooseReplacement(title);
    if(NET.on) NET.send({t:"pick", seq, i});
    return i;
  }
  if(NET.on){
    waitingMsg("相手が交代先を選んでいます…");
    const i = await NET.wait("pick:"+seq);
    clearWaiting();
    return i == null ? alive[0].i : i;
  }
  return pick(alive).i;
}

async function sendOnce(){
  const youNeed = YOU().dead, foeNeed = FOE().dead;
  if(!youNeed && !foeNeed) return false;

  const aliveY = B.you.map((u,i)=>({u,i})).filter(o=>!o.u.dead);
  const aliveF = B.foe.map((u,i)=>({u,i})).filter(o=>!o.u.dead);
  if(youNeed && !aliveY.length){ finish("foe"); return false; }
  if(foeNeed && !aliveF.length){ finish("you"); return false; }

  // 双方が同時に選ぶ。相手の交代先を見てから決められないようにする
  let seq = B.pickSeq;
  const jobs = [];
  if(youNeed){ const q = seq++; jobs.push(decideSwitch("you", q, aliveY).then(i=>{ B.yi = i; })); }
  if(foeNeed){ const q = seq++; jobs.push(decideSwitch("foe", q, aliveF).then(i=>{ B.fi = i; })); }
  B.pickSeq = seq;
  await Promise.all(jobs);
  if(B.over) return false;
  if(youNeed){ sprite("you").classList.remove("faint"); say(`ゆけ、${nm(YOU())}！`); }
  if(foeNeed){ sprite("foe").classList.remove("faint"); say(`${nm(FOE())} が現れた！`); }
  paint(true); await sleep(550);
  if(youNeed) await applyHazards(YOU());
  if(foeNeed) await applyHazards(FOE());
  if(youNeed && !YOU().dead) onEnter(YOU());
  if(foeNeed && !FOE().dead) onEnter(FOE());
  paint();
  return true;
}

/* 寄生の吸い取り1回分。植え付け時とターン終了時の両方から呼ぶ */
function siphon(victim, host){
  const d = Math.max(1, Math.floor(victim.maxhp/10));
  const drained = Math.min(d, Math.max(0, victim.hp));   // 実際に吸えた分
  if(!indirect(victim, d, "寄生")) return "";
  popDmg(victim.side, "-"+d, "#7ed08a");
  let msg = `${nm(victim)} は種に体力を吸い取られた (-${d})`;
  if(host && !host.dead && host.hp < host.maxhp && drained > 0){
    const h = Math.min(drained, host.maxhp - host.hp);
    host.hp += h;
    popDmg(host.side, "+"+h, "#63c07d");
    msg += ` → ${nm(host)} が回復 (+${h})`;
  }
  return msg;
}

async function endTurn(){
  let shown = false;
  for(const u of [YOU(), FOE()]){
    if(u.dead) continue;
    u.guarding = false;                                  // 守るはそのターン限り
    u.en = Math.min(u.maxen, u.en + EN_REGEN + (u.equip==="belt" ? 10 : 0));

    if(u.equip === "berry" && u.hp < u.maxhp){
      const h = Math.max(1, Math.floor(u.maxhp*.05));
      u.hp = Math.min(u.maxhp, u.hp+h);
      popDmg(u.side, "+"+h, "#63c07d"); shown = true;
    }
    u.bond = false;                       // 道連れはそのターン限り
    if(u.perish > 0){
      if(--u.perish === 0){
        ringAt(u.side, "#f0937d"); screenFlash("#6b3b3466");
        say(`${nm(u)} は滅びの唄に呑まれた！`);
        u.hp = 0; shown = true;
      } else { say(`<span class="sys">${u.name} の滅びのカウント: あと${u.perish}</span>`); shown = true; }
    }
    if(u.encore   && --u.encore.turns   <= 0){ u.encore = null;   say(`<span class="sys">${u.name} の反響は収まった。</span>`); shown = true; }
    if(u.disabled && --u.disabled.turns <= 0){ u.disabled = null; say(`<span class="sys">${u.name} の封技は解けた。</span>`); shown = true; }
    if(u.tauntTurns > 0 && --u.tauntTurns <= 0){ say(`<span class="sys">${u.name} は冷静さを取り戻した。</span>`); shown = true; }
    if(u.bindTurns > 0){
      if(!isBound(u)){ u.bindTurns = 0; u.boundBy = null; }
      else if(--u.bindTurns === 0){
        u.boundBy = null;
        say(`<span class="sys">${u.name} を捕らえていた渦が消えた。</span>`);
        shown = true;
      }
    }
    if(u.status && has(u,"quick")){
      if(++u.statusTurns >= 3){
        say(`${nm(u)} の${u.status}は自然に治った。`);
        u.status = null; u.statusTurns = 0; shown = true;
      }
    }
    if(u.status === "やけど"){
      const d = Math.max(1, Math.floor(u.maxhp/16));
      if(indirect(u, d, "やけどのダメージ")){ popDmg(u.side, "-"+d, "#ff9450");
        say(`${nm(u)} はやけどのダメージを受けた (-${d})`); }
      shown = true;
    }
    if(u.seedTurns > 0){
      { const msg = siphon(u, u.side === "you" ? FOE() : YOU()); if(msg) say(msg); }
      if(--u.seedTurns === 0) say(`<span class="sys">${u.name} に植えられた種は枯れ落ちた。</span>`);
      shown = true;
    }
  }
  paint();
  if(shown) await sleep(650);
}

function finish(winner){
  B.over = true; B.busy = true;
  const win = winner === ME;
  $("#resTitle").textContent = win ? "勝利" : "敗北";
  $("#resTitle").className = "big " + (win?"win":"lose");
  const left = myTeam().filter(u=>!u.dead).length;
  $("#resBody").textContent = win
    ? `${B.turn}ターンで決着。手持ちは ${left}体 残りました。`
    : `${B.turn}ターンで全滅。技構成か装備を見直してみてください。`;
  if(NET.on){ NET.send({t:"bye"}); NET.on = false; }
  setTimeout(()=>{
    $("#btnAgain").style.display = NET.host === null ? "" : "";
    show("scResult");
  }, 900);
}

/* ================= 通信（PeerJS / ロックステップ） =================
   盤面は両端末で同じ計算をする。やり取りするのは
   ・開始時: シードと双方の構築
   ・毎ターン: 自分が選んだ行動
   ・交代が要るとき: 選んだ控えの番号
   だけで、状態そのものは送らない。 */
const NET = {
  on:false, peer:null, conn:null, host:false, pass:"",
  q:{}, waiters:{},

  send(msg){ try{ if(this.conn && this.conn.open) this.conn.send(msg); }catch(e){} },

  deliver(key, val){
    if(this.waiters[key]){ const w = this.waiters[key]; delete this.waiters[key]; w(val); }
    else this.q[key] = val;
  },
  wait(key){
    return new Promise(res=>{
      if(key in this.q){ const v = this.q[key]; delete this.q[key]; res(v); }
      else this.waiters[key] = res;
    });
  },
  /* 切断時は待っている全員を null で起こす */
  abortAll(){
    Object.keys(this.waiters).forEach(k=>{ const w=this.waiters[k]; delete this.waiters[k]; w(null); });
  },

  onData(msg){
    if(!msg || !msg.t) return;
    if(msg.t === "act")   return this.deliver("act:"+msg.turn, msg.act);
    if(msg.t === "pick")  return this.deliver("pick:"+msg.seq, msg.i);
    if(msg.t === "team")  return this.deliver("team", msg.team);
    if(msg.t === "start") return this.deliver("start", msg);
    if(msg.t === "bye"){ this.on = false; this.abortAll(); netLost("相手が退出しました。"); }
  },

  reset(){
    this.on = false; this.q = {}; this.abortAll();
    try{ if(this.conn) this.conn.close(); }catch(e){}
    try{ if(this.peer)  this.peer.destroy(); }catch(e){}
    this.conn = null; this.peer = null;
  }
};

function netLost(msg){
  if(B && !B.over){ B.over = true; B.busy = true; }
  clearWaiting();
  lobbyStatus(msg, true);
  if($("#scBattle").classList.contains("on")) say(`<span class="bad">${msg}</span>`);
}
function waitingMsg(t){
  const box = $("#cmd");
  if(box) box.innerHTML = `<div class="wait wide">${t}</div>`;
  const b = $("#bench"); if(b) b.innerHTML = "";
}
function clearWaiting(){ const w = document.querySelector(".wait"); if(w) w.remove(); }
function lobbyStatus(t, bad){
  const e = $("#lobbyStatus");
  if(e){ e.textContent = t; e.className = "hint" + (bad ? " err" : ""); }
}

const PEER_PREFIX = "genju-battle-";
const teamPayload = () => party.map(p=>({id:p.id, moves:p.moves.slice(), equip:p.equip, ability:p.ability}));

/* 相手から届いた構築を検証する。壊れていれば null */
function sanitizeTeam(t){
  if(!Array.isArray(t) || t.length !== 3) return null;
  const out = [];
  for(const e of t){
    const sp = SPECIES.find(x=>x.id === e.id);
    if(!sp) return null;
    const pool = learnable(sp);
    const mv = Array.isArray(e.moves) ? e.moves.filter(k=>pool.includes(k)) : [];
    if(mv.length !== 4 || new Set(mv).size !== 4) return null;
    const ab = ABIL_OF[e.id].includes(e.ability) ? e.ability : ABIL_OF[e.id][0];
    const eq = EQUIPS[e.equip] ? e.equip : "none";
    out.push({id:e.id, moves:mv, equip:eq, ability:ab});
  }
  return out;
}

async function hostGame(pass){
  NET.reset(); NET.host = true; NET.pass = pass;
  lobbyStatus("合言葉で待機しています。相手の接続を待っています…");
  NET.peer = new Peer(PEER_PREFIX + pass);
  NET.peer.on("error", e => lobbyStatus("接続できません（合言葉が使用中かもしれません）: " + e.type, true));
  NET.peer.on("connection", conn => {
    NET.conn = conn;
    conn.on("data", m => NET.onData(m));
    conn.on("close", () => { NET.on = false; NET.abortAll(); netLost("接続が切れました。"); });
    conn.on("open", async () => {
      lobbyStatus("接続しました。構築を交換しています…");
      const raw = await NET.wait("team");
      const guest = sanitizeTeam(raw);
      if(!guest){ lobbyStatus("相手の構築が不正でした。", true); return; }
      const seed = (Date.now() ^ 0x9e3779b9) >>> 0;
      NET.send({t:"start", seed, team:teamPayload()});
      NET.on = true;
      beginBattle(party, guest, seed, "you");
    });
  });
}

async function joinGame(pass){
  NET.reset(); NET.host = false; NET.pass = pass;
  lobbyStatus("接続しています…");
  NET.peer = new Peer();
  NET.peer.on("error", e => lobbyStatus("接続できません（相手が待機していないかも）: " + e.type, true));
  NET.peer.on("open", () => {
    const conn = NET.peer.connect(PEER_PREFIX + pass, {reliable:true});
    NET.conn = conn;
    conn.on("data", m => NET.onData(m));
    conn.on("close", () => { NET.on = false; NET.abortAll(); netLost("接続が切れました。"); });
    conn.on("open", async () => {
      lobbyStatus("接続しました。構築を交換しています…");
      NET.send({t:"team", team:teamPayload()});
      const st = await NET.wait("start");
      if(!st) return;
      const hostTeam = sanitizeTeam(st.team);
      if(!hostTeam){ lobbyStatus("相手の構築が不正でした。", true); return; }
      NET.on = true;
      beginBattle(hostTeam, party, st.seed, "foe");
    });
  });
}

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  window.scrollTo(0,0);
}
const passOk = () => /^[A-Za-z0-9]{3,24}$/.test($("#passIn").value.trim());
function syncLobby(){
  const ready = party.length===3 && party.every(p=>p.moves.length===4);
  const ok = ready && passOk();
  $("#btnHost").disabled = !ok;
  $("#btnJoin").disabled = !ok;
  if(!ready) lobbyStatus("先に手持ちと技を決めてください。");
  else if(!passOk()) lobbyStatus("合言葉を英数字3〜24文字で入れてください。");
}
$("#passIn").oninput = syncLobby;
$("#btnHost").onclick = ()=> hostGame($("#passIn").value.trim());
$("#btnJoin").onclick = ()=> joinGame($("#passIn").value.trim());
$("#btnCancelNet").onclick = ()=>{ NET.reset(); lobbyStatus("中止しました。"); };

$("#btnStart").onclick = startBattle;
$("#btnRand").onclick = ()=>{ party = randBuild(); renderAll(); };
$("#btnClearDraft").onclick = ()=>{
  party = [];
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  renderAll();
};
$("#btnAgain").onclick = startBattle;
$("#btnBack").onclick  = ()=>{ NET.reset(); ME = "you"; show("scBuild"); renderAll(); };

drawField(document.getElementById("fieldCanvas"));
renderChart();
party = loadDraft() || randBuild();
renderAll();
