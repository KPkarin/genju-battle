<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幻獣闘記 ─ 戦闘エンジン試作</title>
<style>
:root{
  --bg:#0d1020;
  --panel:#171c33;
  --panel2:#1f2743;
  --line:#2f3a63;
  --gold:#e3b04b;
  --bone:#e9e5d8;
  --dim:#8c93b5;
  --red:#d8503c;
  --green:#63c07d;
  --blue:#4c8fd8;
  --mono:"SFMono-Regular",Menlo,Consolas,"MS Gothic","Osaka-Mono",monospace;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","MS PGothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--bone);
  font-family:var(--gothic);
  font-size:14px;
  line-height:1.5;
  padding:10px;
  max-width:760px;
  margin:0 auto;
  overflow-x:hidden;
}
h1{
  font-family:var(--mono);
  font-size:15px;
  letter-spacing:.28em;
  color:var(--gold);
  margin:6px 0 2px;
  font-weight:700;
}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:14px}
.screen{display:none}
.screen.on{display:block}

/* ---------- generic ---------- */
button{
  font-family:var(--gothic);
  font-size:13px;
  color:var(--bone);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:2px;
  padding:9px 12px;
  cursor:pointer;
  transition:background .12s,border-color .12s;
}
button:hover:not(:disabled){background:#28315480;border-color:var(--gold)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.primary{background:var(--gold);color:#161020;border-color:var(--gold);font-weight:700;letter-spacing:.08em}
.primary:hover:not(:disabled){background:#f0c368;border-color:#f0c368}
.ghost{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);margin:16px 0 7px}

/* ---------- type chips ---------- */
.t{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:2px;letter-spacing:.1em;border:1px solid}
.t-炎{color:#ff9450;border-color:#7a3416;background:#7a341630}
.t-水{color:#66b6ee;border-color:#1b4b73;background:#1b4b7330}
.t-草{color:#7ed08a;border-color:#245c33;background:#245c3330}
.t-雷{color:#f4d75e;border-color:#6d5a13;background:#6d5a1330}
.t-岩{color:#bab2a4;border-color:#54514a;background:#54514a30}
.t-地{color:#d59a53;border-color:#6b4a1e;background:#6b4a1e30}
.t-空{color:#a8dfe0;border-color:#356b6d;background:#356b6d30}
.t-幻{color:#f09ad8;border-color:#6b2a58;background:#6b2a5830}
.t-影{color:#b58cf0;border-color:#452a70;background:#452a7030}
.t-無{color:#a8b0cc;border-color:#3a4266;background:#3a426630}

/* ---------- build screen ---------- */
.mongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.moncard{
  background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:8px 6px;text-align:center;cursor:pointer;position:relative;
}
.moncard.sel{border-color:var(--gold);background:#241f2e}
.moncard .no{position:absolute;top:4px;left:6px;font-family:var(--mono);font-size:10px;color:var(--gold)}
.moncard .nm{font-size:12px;font-weight:700;margin-top:2px}
.moncard .st{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.04em;margin-top:3px}
canvas.sp{width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:0 auto}

.slot{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px;margin-bottom:9px}
.slot h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:7px}
.slot h3 .idx{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.15em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-size:11px;padding:5px 7px;border:1px solid var(--line);border-radius:2px;
  background:#141829;cursor:pointer;display:flex;align-items:center;gap:5px;
}
.chip.on{border-color:var(--gold);background:#2a2334;color:#fff}
.chip .pw{font-family:var(--mono);font-size:9px;color:var(--dim)}
.count{font-family:var(--mono);font-size:10px;color:var(--dim);margin:6px 0 3px;letter-spacing:.1em}
select{
  width:100%;background:#141829;color:var(--bone);border:1px solid var(--line);
  border-radius:2px;padding:7px;font-family:var(--gothic);font-size:12px;margin-top:3px;
}
.hint{font-size:11px;color:var(--dim);margin:4px 0 0;line-height:1.5}

/* ---------- lobby ---------- */
.lobby{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:11px}
.pass{width:100%;background:#0a0d1c;color:var(--bone);border:1px solid var(--line);border-radius:2px;
  padding:9px 10px;font-family:var(--mono);font-size:14px;letter-spacing:.12em;margin-top:8px}
.pass:focus{outline:none;border-color:var(--gold)}
.hint.err{color:var(--red)}
.wait{background:#141829;border:1px dashed var(--line);border-radius:3px;padding:16px;
  text-align:center;font-size:12px;color:var(--dim);letter-spacing:.08em}
.netbadge{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#161020;
  background:var(--green);padding:2px 7px;border-radius:2px;margin-left:7px}

/* ---------- type filter ---------- */
.tfbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tfbar .tf{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:2px;
  background:#141829;border:1px solid var(--line);color:var(--dim);cursor:pointer}
.tfbar .tf.on{border-color:var(--gold);color:var(--bone);background:#241f2e}
.tfbar .tf.t{font-size:11px}

/* ---------- roster card ---------- */
.mongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.moncard{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:9px 8px 8px;text-align:center;cursor:pointer;position:relative;transition:border-color .12s}
.moncard.sel{border-color:var(--gold);background:#241f2e}
.moncard.dim{opacity:.42}
.moncard .pick{position:absolute;top:0;left:0;right:0;font-family:var(--mono);font-size:9px;
  letter-spacing:.18em;background:var(--gold);color:#161020;padding:1px 0;border-radius:3px 3px 0 0}
.moncard canvas.sp{width:64px;height:64px;margin:6px auto 3px}
.moncard .nm{font-size:13px;font-weight:700}
.moncard .tl{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:3px}
.moncard .aff{font-family:var(--mono);font-size:9px;color:var(--dim)}
.stats{margin-top:6px;display:grid;gap:2px}
.sb{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:8.5px;color:var(--dim)}
.sb span{width:15px;flex:none;text-align:left}
.sb i{flex:1;height:5px;background:#080b16;border-radius:1px;display:block;overflow:hidden;
  border:1px solid #1c2138}
.sb i u{display:block;height:100%;text-decoration:none;border-radius:1px;transition:width .2s}
.sb b{width:22px;flex:none;text-align:right;font-weight:400;color:#a9b0cc}
.sb.hp  i u{background:#63c07d}
.sb.atk i u{background:#d8503c}
.sb.def i u{background:#4c8fd8}
.sb.spd i u{background:#e3b04b}

/* ---------- coverage ---------- */
.cov{background:#0e1224;border:1px solid var(--line);border-radius:3px;padding:8px 10px;margin-top:9px;
  display:grid;gap:5px;font-size:11.5px}
.cov .ct{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);margin-right:7px}
.cov .ok{color:var(--green);font-size:11px}
.cov b{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin:0 6px 0 2px;font-weight:400}

/* ---------- slot ---------- */
.slot{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:11px;margin-bottom:10px}
.shead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.shead canvas.sm{width:64px;height:64px;flex:none}
.sinfo{flex:1;min-width:0}
.sn{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.sn .idx{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.15em}
.ssub{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:2px}
.sdone{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);
  border-radius:2px;padding:3px 7px;flex:none}
.sdone.ok{color:#161020;background:var(--gold);border-color:var(--gold)}
.slot.lead{border-color:#4a5580}
.ord{display:flex;flex-direction:column;gap:2px;flex:none}
.ob{padding:1px 6px;font-size:10px;line-height:1.3;min-width:24px;background:#141829}
.ob:disabled{opacity:.25}
.leadbtn{width:100%;margin-bottom:9px;padding:7px;font-size:11.5px;background:#141829}
.ordbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#0e1224;
  border:1px solid var(--line);border-radius:3px;padding:8px 10px;margin-bottom:10px;font-size:12px}
.ordbar span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);margin-right:2px}
.ordbar b{font-weight:700}
.ordbar b.lead{color:var(--gold)}
.ordbar i{color:var(--dim);font-style:normal;font-size:10px}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:9px}
.selslot{display:flex;align-items:center;gap:5px;background:#141829;border:1px solid var(--line);
  border-radius:2px;padding:7px 8px;font-size:12px;cursor:pointer;min-height:32px}
.selslot.empty{border-style:dashed;cursor:default}
.selslot .ph{color:var(--dim);font-size:11px}

/* ---------- move picker ---------- */
.mpick{border:1px solid var(--line);border-radius:3px;padding:0;background:#0e1224;margin-bottom:10px}
.mpick>summary{padding:9px 11px;font-size:11.5px;letter-spacing:.06em;color:var(--bone);font-family:var(--gothic)}
.mbody{padding:0 9px 9px;max-height:340px;overflow-y:auto}
.mgrp{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  color:var(--dim);margin:10px 0 5px;padding-top:7px;border-top:1px solid var(--line)}
.mrow{border:1px solid var(--line);border-radius:3px;padding:7px 9px;margin-bottom:5px;
  background:#141829;cursor:pointer;transition:border-color .12s}
.mrow.on{border-color:var(--gold);background:#241f2e}
.mrow.off{opacity:.38}
.mhead{display:flex;align-items:center;gap:6px}
.mhead .mn{font-size:13px;font-weight:700}
.mhead .mck{margin-left:auto;color:var(--gold);font-size:13px}
.bd{font-family:var(--mono);font-size:8.5px;font-weight:400;padding:1px 4px;border-radius:2px}
.bd.pri{color:#161020;background:#7ed08a}
.bd.late{color:#b58cf0;border:1px solid #452a70}
.bd.own{color:#7ed08a;border:1px solid #245c33}
.mst{font-family:var(--mono);font-size:9.5px;color:#9aa2c4;margin-top:3px}
.mdesc{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.45}

/* ---------- cards (ability / equip) ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.card{background:#141829;border:1px solid var(--line);border-radius:3px;padding:7px 9px;cursor:pointer}
.card.on{border-color:var(--gold);background:#241f2e}
.card .cn{font-size:12.5px;font-weight:700}
.card .cd{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4}

/* ---------- battle stage ---------- */
.stage{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#10192b;
  border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px;
}
#fieldCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
canvas.actor{position:absolute;height:auto;image-rendering:pixelated}
canvas.actor.foe{width:23%;left:62.5%;bottom:46%}
canvas.actor.you{width:29%;left:11.5%;bottom:14%}
.hit{animation:hit .3s steps(2) 2}
@keyframes hit{0%{filter:brightness(4) saturate(0)}100%{filter:none}}
.faint{animation:faint .45s forwards}
@keyframes faint{to{transform:translateY(30px);opacity:0}}
.enter{animation:enter .3s}
@keyframes enter{from{transform:translateY(-14px);opacity:0}}

.hud{position:absolute;background:#0b0f1fee;border:1px solid var(--line);border-radius:3px;padding:7px 9px;width:48%;backdrop-filter:blur(2px)}
.hud.foe{left:4%;top:7%}
.hud.you{right:4%;bottom:6%}
.hud .nm{font-size:12.5px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.bar{height:7px;background:#000;border:1px solid #33406b;border-radius:1px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .35s ease}
.bar.en i{background:var(--blue)}
.hud .val{font-family:var(--mono);font-size:9.5px;color:#a9b0cc;text-align:right;margin-top:3px;letter-spacing:.04em}
.eqline{font-family:var(--mono);font-size:9px;color:#cfc7ae;letter-spacing:.04em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqline .no{color:var(--dim)}
.team{display:grid;gap:5px}
.trow{display:flex;align-items:center;gap:7px;background:#141829;border:1px solid var(--line);border-radius:2px;padding:6px 8px;font-size:11.5px}
.trow.out{opacity:.4}
.trow.act{border-color:var(--gold)}
.trow .who{font-family:var(--mono);font-size:9px;letter-spacing:.1em;width:34px;flex:none}
.trow .w-you{color:var(--gold)}
.trow .w-foe{color:#f0937d}
.trow .nmx{font-weight:700;flex:none}
.trow .eq{font-family:var(--mono);font-size:9.5px;color:#cfc7ae;margin-left:auto;text-align:right;line-height:1.35}
.trow .eq i{display:block;color:var(--dim);font-style:normal;font-size:9px}
/* ---------- move effects ---------- */
.pt{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:3;
  margin:-2px 0 0 -2px;animation:pt .6s ease-out forwards}
@keyframes pt{
  from{transform:translate(0,0) scale(1.15);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
.pt.heal{background:#63c07d;width:4px;height:4px;animation:ptheal .8s ease-out forwards}
@keyframes ptheal{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.ring{position:absolute;border-radius:50%;border:2px solid;pointer-events:none;z-index:3;
  transform:translate(-50%,-50%);animation:rg .6s ease-out forwards}
@keyframes rg{from{width:6px;height:6px;opacity:.95}to{width:120px;height:120px;opacity:0}}
.flashfx{position:absolute;inset:0;pointer-events:none;z-index:2;animation:ff .35s ease-out forwards}
@keyframes ff{from{opacity:1}to{opacity:0}}
.streak{position:absolute;left:0;width:100%;height:2px;pointer-events:none;z-index:3;
  background:linear-gradient(90deg,#0000,#eaf3fa,#0000);animation:stk .5s ease-out forwards}
@keyframes stk{from{transform:translateX(-40%);opacity:0}30%{opacity:1}to{transform:translateX(40%);opacity:0}}
.bolt{position:absolute;top:0;width:3px;height:58%;pointer-events:none;z-index:3;
  background:linear-gradient(#fffbc4,#f4d75e);clip-path:polygon(40% 0,100% 45%,55% 45%,100% 100%,0 55%,45% 55%,0 0);
  animation:blt .4s steps(3) forwards}
@keyframes blt{from{opacity:1}to{opacity:0}}
.stage.shake{animation:shk .38s}
@keyframes shk{0%,100%{transform:translate(0)}
  20%{transform:translate(-4px,2px)}45%{transform:translate(4px,-2px)}
  70%{transform:translate(-3px,1px)}}
canvas.actor.you.lunge{animation:lgY .3s ease-out}
@keyframes lgY{45%{transform:translate(42px,-26px) scale(1.06)}}
canvas.actor.foe.lunge{animation:lgF .3s ease-out}
@keyframes lgF{45%{transform:translate(-42px,26px) scale(1.06)}}
.dmg{position:absolute;z-index:4;font-family:var(--mono);font-weight:700;font-size:19px;color:#fff;
  text-shadow:0 2px 0 #000;pointer-events:none;animation:fly 1s forwards}
@keyframes fly{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-38px);opacity:0}}

/* ---------- team strip ---------- */
.strip{display:grid;gap:4px;margin-bottom:8px}
.srow{display:flex;align-items:stretch;gap:4px}
.slb{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;width:34px;flex:none;
  display:flex;align-items:center}
.cell{flex:1;min-width:0;background:#0e1224;border:1px solid var(--line);border-radius:2px;padding:4px 6px}
.cell.act{border-color:var(--gold);background:#1a1a2e}
.cell.out{opacity:.35}
.cell .cn{font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden}
.cell .cn .t{font-size:8.5px;padding:0 3px}
.cbar{height:4px;background:#000;border-radius:1px;margin:3px 0 2px;overflow:hidden}
.cbar i{display:block;height:100%;transition:width .35s}
.cft{font-family:var(--mono);font-size:8.5px;color:var(--dim);display:flex;align-items:center;gap:4px}
.mks{margin-left:auto;display:flex;gap:2px}
.mk{font-style:normal;font-size:8px;padding:0 2px;border-radius:1px;line-height:1.4}
.mk.s{color:#f4d75e;border:1px solid #6d5a13}
.mk.b{color:#a8b0cc;border:1px solid #3a4266}
.mk.p{color:#f0937d;border:1px solid #6b3b34}
.mk.w{color:#66b6ee;border:1px solid #1b4b73}
.mk.r{color:#f09ad8;border:1px solid #6b2a58}

/* ---------- log & commands ---------- */
.log{
  background:#0a0d1c;border:1px solid var(--line);border-radius:3px;
  padding:10px 12px;height:132px;overflow-y:auto;font-size:12.5px;line-height:1.7;
}
.log p{margin:0 0 3px}
.log p:last-child{color:#fff}
.log .em{color:var(--gold)}
.log .u-you{color:var(--gold);font-weight:700}
.log .u-foe{color:#f0937d;font-weight:700}
.pfx{color:#f0937d;font-family:var(--mono);font-size:9px;letter-spacing:.12em;margin-right:2px}
.log .bad{color:var(--red)}
.log .good{color:var(--green)}
.log .sys{color:var(--dim);font-size:11px}
.cmd{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.cmd button{text-align:left;padding:9px 11px;display:block;min-height:60px}
.cmd .mv{display:flex;flex-direction:column;gap:3px}
.cmd .mvx{font-size:10.5px;color:var(--dim);line-height:1.45}
.cmd .lockmsg{font-size:10.5px;color:#f0937d;line-height:1.45}
.cmd .mv{display:flex;flex-direction:column;gap:3px}
.cmd .mvn{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.cmd .mvd{font-family:var(--mono);font-size:9.5px;color:#9aa2c4;letter-spacing:.03em;line-height:1.5}
.wide{grid-column:1/-1}
.eff{font-family:var(--mono);font-size:8.5px;padding:1px 4px;border-radius:2px;font-weight:400}
.eff.up{color:#161020;background:var(--gold)}
.eff.dn{color:var(--dim);border:1px solid var(--line)}
.eff.no{color:#f0937d;border:1px solid #6b3b34}
.eff.st{color:#a8dfe0;border:1px solid #356b6d;margin-right:3px}
.eff.pri{color:#161020;background:#7ed08a;margin-right:3px}
.eff.late{color:#b58cf0;border:1px solid #452a70;margin-right:3px}
.st-tag{font-family:var(--mono);font-size:9px;color:#f4d75e;border:1px solid #6d5a13;padding:0 3px;border-radius:2px}
.st-麻痺{color:#f4d75e;border-color:#6d5a13}
.st-やけど{color:#ff9450;border-color:#7a3416}
.st-寄生{color:#7ed08a;border-color:#245c33}
.st-拘束{color:#66b6ee;border-color:#1b4b73}
.st-幻{color:#f09ad8;border-color:#6b2a58}
.st-挑発{color:#b58cf0;border-color:#452a70}
.st-身代{color:#a8b0cc;border-color:#3a4266}
.st-滅び{color:#f0937d;border-color:#6b3b34}
.rk{font-family:var(--mono);font-size:9px;padding:0 3px;border-radius:2px;margin-left:2px}
.rk.up{color:#161020;background:var(--gold)}
.rk.dn{color:#f0937d;border:1px solid #6b3b34}
.bench{display:flex;gap:6px;margin-top:7px}

<div class="sub">BATTLE ENGINE PROTOTYPE / 3 vs 3</div>

<div id="scBuild" class="screen on">

  <div class="mongrid" id="roster"></div>
  <div id="coverage"></div>
  <div class="eyebrow">02 ─ 技4つと装備を決める</div>
  <div id="slots"></div>
  <p class="hint" id="buildHint"></p>
  <div class="row" style="margin-top:12px">
    <button class="primary" id="btnStart" disabled>AIと戦う</button>
    <button class="ghost" id="btnRand">ランダム構築</button>
    <button class="ghost" id="btnClearDraft">編成をクリア</button>
  </div>

  <div class="eyebrow">03 ─ 友達と対戦する</div>
  <div class="lobby">
    <p class="hint">同じ合言葉を入れて、片方が「部屋を作る」、もう片方が「部屋に入る」を押してください。
      構築とシードを交換したあと、毎ターンお互いの選択だけをやり取りします。</p>

           placeholder="合言葉（英数字）" maxlength="24">
    <div class="row" style="margin-top:7px">
      <button class="primary" id="btnHost" disabled>部屋を作る</button>
      <button id="btnJoin" disabled>部屋に入る</button>

    </div>
    <p class="hint" id="lobbyStatus"></p>
  </div>
  <details>
    <summary>タイプ相性表</summary>
    <div id="chartBox" style="margin-top:8px;overflow-x:auto"></div>
    <p class="hint">縦が攻撃側、横が受け側。<b>影</b>だけは自分自身に2倍が入る高リスク型。</p>
  </details>
</div>

<!-- ============ BATTLE ============ -->
<div id="scBattle" class="screen">
  <div class="stage" id="stage">
    <canvas id="fieldCanvas" width="384" height="216" aria-hidden="true"></canvas>
    <canvas class="actor foe" id="spFoe" width="32" height="32"></canvas>
    <canvas class="actor you" id="spYou" width="32" height="32"></canvas>
    <div class="hud foe">
      <div class="nm"><span id="foeName"></span><span id="foeTags"></span></div>
      <div class="bar"><i id="foeHp"></i></div>
      <div class="val" id="foeHpV"></div>
      <div class="eqline" id="foeEq"></div>
    </div>
    <div class="hud you">
      <div class="nm"><span id="youName"></span><span id="youTags"></span></div>
      <div class="bar"><i id="youHp"></i></div>
      <div class="bar en"><i id="youEn"></i></div>
      <div class="val" id="youHpV"></div>
      <div class="eqline" id="youEq"></div>
    </div>
  </div>
  <div class="strip" id="strip"></div>
  <div class="log" id="log"></div>
  <div class="cmd" id="cmd"></div>
  <div class="bench" id="bench"></div>
  <details id="teamPanel">
    <summary>手持ちの詳細（特性・持ち物・足元）</summary>
    <div id="teamBox" style="margin-top:8px"></div>
  </details>
</div>

<!-- ============ RESULT ============ -->
<div id="scResult" class="screen">
  <div class="result">
    <div class="big" id="resTitle"></div>
    <p class="hint" id="resBody" style="margin-bottom:16px"></p>
    <div class="row" style="justify-content:center">

      <button class="ghost" id="btnBack">編成に戻る</button>
    </div>
  </div>
</div>

/* ================= seeded RNG =================
   ネット対戦時はホストが seed を配れば両者で同じ結果になる */
let _seed = (Date.now() ^ 0x9e3779b9) >>> 0;
function setSeed(s){ _seed = s >>> 0; }
function rng(){
  _seed = (_seed + 0x6D2B79F5) >>> 0;
  let t = _seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = n => Math.floor(rng() * n);
const pick = a => a[ri(a.length)];

  heavy   :{n:"重圧", d:"相手の技の消費気力+8"}
};
/* 特性の判定はすべてここを通る。無垢の仮面を持っている間は全特性が沈黙する */
const abilOff = u => !!EQUIPS[u.equip].mask;
const has = (u, k) => u.ability === k && !abilOff(u);
/* 守り側の特性。攻撃側が型破りなら無かったことになる */
const hasVs = (def, k, att) => has(def, k) && !(att && has(att, "breaker"));

/* 拘束中かどうか。縛った個体が場を離れていれば解けている扱い */
function isBound(u){
  if(!u || u.bindTurns <= 0 || !u.boundBy) return false;
  const by = u.boundBy;
  return !by.dead && active(by.side) === by;
}

/* ================= pixel field ================= */
/* Native 384 × 216 pixel field. All marks use integer fillRect calls.
   Decorative randomness is private and never consumes the battle's RNG. */
function drawField(canvas){
  const W = 384, H = 216;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  let seed = 0x67b38ac1;
  const rand = n => {
    seed = (Math.imul(seed,1664525) + 1013904223) >>> 0;
    return Math.floor(seed / 4294967296 * n);
  };
  const rect = (x,y,w,h,c) => {
    ctx.fillStyle = c;
    ctx.fillRect(Math.floor(x),Math.floor(y),Math.floor(w),Math.floor(h));
  };
  const ellipse = (cx,cy,rx,ry,c) => {
    for(let y=-ry; y<=ry; y++){
      const dx = Math.floor(rx * Math.sqrt(Math.max(0,1-y*y/(ry*ry))));
      rect(cx-dx,cy+y,dx*2+1,1,c);
    }
  };
  const poly = (points,c) => {
    const top=Math.min(...points.map(p=>p[1])), bottom=Math.max(...points.map(p=>p[1]));
    for(let y=top;y<=bottom;y++){
      const cuts=[];
      for(let i=0;i<points.length;i++){
        const a=points[i],b=points[(i+1)%points.length];
        if((a[1]<=y+.5&&b[1]>y+.5)||(b[1]<=y+.5&&a[1]>y+.5)){
          cuts.push(a[0]+(y+.5-a[1])*(b[0]-a[0])/(b[1]-a[1]));
        }
      }
      cuts.sort((a,b)=>a-b);
      for(let i=0;i+1<cuts.length;i+=2){
        const x=Math.ceil(cuts[i]);
        rect(x,y,Math.floor(cuts[i+1])-x+1,1,c);
      }
    }
  };
  const line=(x0,y0,x1,y1,c)=>{
    const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
    let err=dx+dy;
    for(;;){
      rect(x0,y0,1,1,c);
      if(x0===x1&&y0===y1)break;
      const e=err*2;
      if(e>=dy){err+=dy;x0+=sx;}
      if(e<=dx){err+=dx;y0+=sy;}
    }
  };

  // A stepped twilight palette, with sparse one-pixel transition dithering.
  const sky=["#121b32","#18243b","#203048","#293d50","#344b58","#405a60"];
  sky.forEach((c,i)=>rect(0,i*17,W,17,c));
  for(let y=15;y<99;y+=17){
    const band=Math.floor(y/17);
    for(let x=(band%2)*2;x<W;x+=4) rect(x,y,1,1,sky[Math.min(band+1,5)]);
    for(let x=2-(band%2)*2;x<W;x+=4) rect(x,y+2,1,1,sky[band]);
  }
  for(let i=0;i<49;i++){
    const x=rand(W),y=4+rand(66);
    if(x>303&&x<351&&y<53)continue;
    rect(x,y,1,1,i%4===0?"#b3c9c8":"#738e9f");
    if(i%13===0){rect(x-1,y,3,1,"#a8bcc6");rect(x,y-1,1,3,"#a8bcc6");}
  }
  // Pixel moon and its stepped aureole.
  ellipse(327,28,19,19,"#263c4d");
  ellipse(327,28,16,16,"#3b5159");
  ellipse(327,28,13,13,"#9fafa2");
  ellipse(326,27,12,12,"#d8d8b7");
  ellipse(324,25,9,10,"#e9e5c5");
  rect(322,19,4,2,"#c5c9ac"); rect(320,21,3,3,"#d0d2b4");
  rect(331,28,4,3,"#c3c9af"); rect(328,33,3,2,"#c3c9af");
  rect(318,29,2,2,"#f3edce");
  // Low broken clouds make the sky feel spacious without masking silhouettes.
  [[24,47,34],[79,38,25],[209,31,26],[279,58,23],[350,50,28]].forEach(([x,y,w])=>{
    rect(x,y,w,1,"#46606b");rect(x+7,y-1,w-13,1,"#3c5363");
    rect(x+4,y+1,w+9,1,"#30495c");
  });

  // Distant ridges and a closer jagged range.
  poly([[0,81],[17,72],[35,77],[60,57],[77,65],[98,45],[127,70],[152,58],[180,77],[210,53],[238,72],[262,58],[289,78],[314,67],[338,80],[363,65],[384,76],[384,108],[0,108]],"#2b4254");
  poly([[0,90],[25,81],[43,88],[66,74],[91,84],[116,63],[139,83],[159,75],[181,91],[204,77],[225,84],[251,70],[273,85],[302,77],[325,88],[354,76],[384,89],[384,110],[0,110]],"#264450");
  poly([[98,45],[107,59],[115,67],[106,63],[101,59],[95,61]],"#4d626c");
  poly([[210,53],[219,66],[210,62],[203,66]],"#4b6069");
  // The forest uses tiered foliage instead of blurred blobs.

/* 各種族が選べる特性は2つ。役割に合うものを割り当ててある */
const ABIL_OF = {
  homura:["grit","tempo"],      youcho:["hide","ballast"],
  shiogame:["ballast","mirror"], soukou:["glutton","tempo"],
  kokejyu:["regen","quick"],     tsutazaru:["glutton","tempo"],
  raitachi:["tempo","blur"],     rainen:["ballast","quick"],
  iwaushi:["hide","mirror"],     saikaku:["grit","spite"],
  fukurou:["tempo","glutton"],   yoigumo:["blur","ghost"],
  doryu:["hide","focus2"],       sarou:["grit","breaker"],
  fuen:["blur","regen"],         ungei:["pressure","heavy"],
  mubaku:["mirror","glutton"],   oborogi:["blur","tempo"]
};
const spec = id => SPECIES.find(s => s.id === id);

/* ステータスバーの正規化。実際の最小〜最大を 18%〜100% に伸ばして差を見せる */
const STAT_RANGE = ["hp","atk","def","spd"].reduce((o,k)=>{
  const vs = SPECIES.map(s=>s[k]);
  o[k] = {min:Math.min(...vs), max:Math.max(...vs)};
  return o;
}, {});
function statPct(key, v){
  const {min,max} = STAT_RANGE[key];
  if(max === min) return 100;
  return Math.round(18 + (v-min)/(max-min)*82);
}
/* 習得できる技。own:true の技は一致タイプの個体しか覚えられない
   （適性で持ち込むと壊れる技を、そのタイプの専売にするための仕組み）。
   例: 寄生種は草タイプ専用 → 適性が草の岩牛は覚えられない。 */
const learnable = s => NEUTRAL.concat(BY_TYPE[s.t], BY_TYPE[s.aff])
  .filter(k => !MOVES[k].own || MOVES[k].t === s.t);

function drawSprite(cv, id, view="front"){
  const sp = (view === "back" ? BACK_SPRITES : SPRITES)[id];
  const h = sp.px.length, w = sp.px[0].length;
  if(cv.width !== w) cv.width = w;
  if(cv.height !== h) cv.height = h;
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,w,h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const c = sp.pal[sp.px[y][x]];
    if(c){ ctx.fillStyle = c; ctx.fillRect(x,y,1,1); }
  }
}

/* ================= build state ================= */
let party = [];   // {id, moves:[], equip}
let foeParty = [];

/* ================= 編成の自動保存 =================
   このHTMLを開いているブラウザだけに保存される（PeerJS通信では送らない）。
   編成画面を閉じてもタブを閉じても、次に開いたときに続きから始められる。 */
const DRAFT_KEY = "genju_battle_draft_v1";

function saveDraft(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(party)); }catch(e){}
}

/* 保存されたデータを検証しながら読み込む。壊れていたり仕様が変わっていても
   読める範囲だけ復元し、読めない部分は静かに捨てる（画面を壊さないため）。 */
function loadDraft(){
  let raw;
  try{ raw = localStorage.getItem(DRAFT_KEY); }catch(e){ return null; }
  if(!raw) return null;
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return null; }
  if(!Array.isArray(data)) return null;
  const out = [];
  for(const e of data.slice(0,3)){
    if(!e || typeof e.id !== "string") continue;
    const sp = SPECIES.find(x=>x.id === e.id);
    if(!sp) continue;                                  // 削除・改名された種族は捨てる
    const pool = learnable(sp);
    const moves = Array.isArray(e.moves)
      ? [...new Set(e.moves.filter(k=>pool.includes(k)))].slice(0,4)
      : [];
    const ability = ABIL_OF[sp.id].includes(e.ability) ? e.ability : ABIL_OF[sp.id][0];
    const equip = EQUIPS[e.equip] ? e.equip : "none";
    out.push({id:sp.id, moves, equip, ability});
  }
  return out.length ? out : null;
}

function randBuild(){
  const ids = SPECIES.map(s=>s.id).sort(()=>rng()-.5).slice(0,3);
  return ids.map(id=>{
    const pool = learnable(spec(id)).slice().sort(()=>rng()-.5);
    return {id, moves:pool.slice(0,4), equip:pick(Object.keys(EQUIPS).filter(k=>k!=="none")),
            ability:pick(ABIL_OF[id])};
  });
}

/* 技1件の表示。威力・命中・気力・優先度・効果を省略せず出す */
function moveRow(m, k, on, disabled, onclick){
  const pr = m.pri || 0;
  const badges =
      (pr>0 ? `<b class="bd pri">先制+${pr}</b>` : pr<0 ? `<b class="bd late">後攻${pr}</b>` : "")
    + (m.own ? '<b class="bd own">専用</b>' : "");
  const stat = m.p>0
    ? `威力 ${m.p}　命中 ${m.acc}　気力 ${m.en}`
    : `変化技　${m.acc?`命中 ${m.acc}　`:""}気力 ${m.en}`;
  const row = el("div","mrow"+(on?" on":"")+(disabled?" off":""));
  row.innerHTML = `
    <div class="mhead">${chip(m.t)}<span class="mn">${m.n}</span>${badges}
      <span class="mck">${on?"✓":""}</span></div>
    <div class="mst">${stat}</div>
    ${m.d?`<div class="mdesc">${m.d}</div>`:""}`;
  if(onclick) row.onclick = onclick;
  return row;
}

/* 手持ち3体の弱点・打点をまとめて出す */
function renderCoverage(){
  const box = $("#coverage");
  if(!box) return;
  if(party.length < 1){ box.innerHTML = ""; return; }
  const mine = party.map(p=>spec(p.id).t);
  const rows = TYPES.filter(t=>t!=="無").map(atk=>{
    const hits = mine.filter(d=>eff(atk,d)>1).length;
    return {atk, hits};
  }).filter(r=>r.hits>0).sort((a,b)=>b.hits-a.hits);
  const offense = new Set();
  party.forEach(p=> p.moves.forEach(k=>{ if(MOVES[k].p>0) offense.add(MOVES[k].t); }));
  const cant = TYPES.filter(d=> ![...offense].some(a=>eff(a,d)>1));
  box.innerHTML = `
    <div class="cov">
      <div><span class="ct">攻められやすい</span>${rows.length
        ? rows.map(r=>`${chip(r.atk)}<b>${r.hits}体</b>`).join(" ")
        : '<span class="ok">目立った弱点なし</span>'}</div>
      <div><span class="ct">弱点を突けない相手</span>${cant.length
        ? cant.map(t=>chip(t)).join(" ")
        : '<span class="ok">全タイプに2倍あり</span>'}</div>
    </div>`;
}

/* ================= battle ================= */
const LV = 50;
const PARA_FAIL  = 1/8; // 麻痺で行動できない確率
const BIND_TURNS = 5;   // 渦潮の拘束ターン数
const SEED_TURNS = 5;   // 寄生の持続。場に出ている間だけ減る
const EN_REGEN   = 22;  // ターン終了時の気力回復（気力帯で +10）
const EN_FOCUS   = 25;  // 「気を溜める」で追加回復する量

/* 一部の装備は、直前に使った技をそのまま繰り返すことを禁じる */
/* その技を今このターン選べるか。選べない場合は理由文字列を返す */
function moveLock(u, key){
  const m = MOVES[key];
  if(u.encore && u.encore.key !== key)
    return `反響で ${MOVES[u.encore.key].n} しか出せない（あと${u.encore.turns}）`;
  if(u.disabled && u.disabled.key === key)
    return `封技で使えない（あと${u.disabled.turns}）`;
  if(u.tauntTurns > 0 && m.p === 0)
    return `挑発で変化技が出せない（あと${u.tauntTurns}）`;
  if(EQUIPS[u.equip].noStatus && m.p === 0)
    return `${EQUIPS[u.equip].n}を着ていて変化技を使えない`;
  if(EQUIPS[u.equip].lock && u.lastMove === key)
    return `${EQUIPS[u.equip].n}のため連続で使えない`;
  return null;
}
const moveBlocked = (u, key) => !!moveLock(u, key);

/* 実際の消費気力。守るだけは連続使用で倍増する（20→40→80…）。
   最大気力が100なので、3回目以降は自然に撃てなくなる。 */
function enCost(u, key){
  const m = MOVES[key];
  let c = m.fx === "guard" ? m.en * Math.pow(2, u.guardStreak) : m.en;
  if(B){                                        // 相手の重圧で余計に消耗する
    const foe = u.side === "you" ? FOE() : YOU();
    if(foe && foe !== u && !foe.dead && has(foe, "heavy")) c += 8;
  }
  return c;
}
function makeUnit(b, side){
  const s = spec(b.id);
  const eq = b.equip;
  return {
    side, sp:s, id:b.id, name:s.n, type:s.t, equip:eq,
    ability: b.ability || ABIL_OF[b.id][0],
    maxhp:s.hp, hp:s.hp, en:100, maxen:100,
    baseAtk:s.atk, baseDef:s.def, baseSpd:s.spd,
    moves:b.moves.slice(),
    rank:{atk:0,def:0,acc:0,spd:0,eva:0},
    status:null,          // null / "麻痺" / "やけど" ─ 重複しない。交代でも治らない
    seedTurns:0,          // 寄生種の残り。交代でも消えず、場に出ている間だけ減る
    statusTurns:0,        // 状態異常の経過ターン。早熟が参照する
    bindTurns:0, boundBy:null,  // 渦潮による拘束。縛った側が場を離れれば解ける
    sub:0,                // 身代わりの残り耐久
    perish:0,             // 滅びの唄の残りターン
    bond:false,           // 道連れを宣言しているか
    restTurns:0,          // 静養の反動で動けない残りターン
    bellUsed:false,       // 癒しの鈴を使ったか
    encore:null,          // {key,turns} 直前の技しか出せない
    disabled:null,        // {key,turns} その技だけ出せない
    tauntTurns:0,         // 変化技を出せない残りターン
    plannedMove:null,     // このターンに選んだ技。不意打ち・おどかすが参照する
    actionCancelled:false,// おどかすで潰されたか
    dmgTaken:0,           // このターンに攻撃で受けたダメージ。仕返しが参照する
    lastMove:null,        // 直前に使った技。連続使用を禁じる装備が参照する
    preHitHp:s.hp,        // 直近の被弾直前のHP
    flinch:false, guarding:false, guardStreak:0,
    charmUsed:false, dead:false
  };
}
/* ランク補正は2系統。
   攻撃・防御・素早さ … 2系（±1で ×1.5 / ×0.667）。ダメージ計算を経由するので効きは間接的。
   命中・回避        … 3系（±1で ×1.333 / ×0.75）。確率に直接掛かるため緩やかにしてある。 */
const statMul = n => n>=0 ? (2+n)/2 : 2/(2-n);
const accMul  = n => n>=0 ? (3+n)/3 : 3/(3-n);
function ATK(u){ let v = u.baseAtk*statMul(u.rank.atk); if(u.equip==="fang") v*=1.2;
  if(has(u,"grit") && u.hp <= u.maxhp/3) v*=1.5; if(u.status==="やけど") v*=.75; return v; }
function DEF(u){ let v = u.baseDef*statMul(u.rank.def); if(u.equip==="plate") v*=1.2; if(u.equip==="armor") v*=1.35; return v; }
function SPD(u){ let v = u.baseSpd*statMul(u.rank.spd); if(u.equip==="wing") v*=1.2; if(u.status==="麻痺") v*=.5; return v; }

/* 場を離れた個体の処理。
   能力ランク・守り・ひるみは失う。麻痺などの状態異常は持ち越す。 */
function leaveField(u){
  const msgs = [];
  if(has(u,"regen") && !u.dead && u.hp < u.maxhp){
    const h = Math.max(1, Math.floor(u.maxhp*.25));
    u.hp = Math.min(u.maxhp, u.hp+h);
    msgs.push(`は再生で体力を取り戻した (+${h})`);
  }
  if(u.rank.atk || u.rank.def || u.rank.acc || u.rank.spd || u.rank.eva) msgs.push("の能力変化は元に戻った。");
  if(u.seedTurns > 0) msgs.push("は植えられた種を振り落とした。");
  u.rank = {atk:0, def:0, acc:0, spd:0, eva:0};
  u.seedTurns = 0;        // 寄生はランク変化と同じく場を離れると消える
  u.guarding = false;
  u.flinch = false;
  u.guardStreak = 0;
  u.dmgTaken = 0;
  u.lastMove = null;   // 場に出し直せば連続扱いは切れる
  if(u.encore || u.disabled || u.tauntTurns) msgs.push("にかかっていた制限は解けた。");
  u.encore = null; u.disabled = null; u.tauntTurns = 0;
  if(u.sub > 0){ u.sub = 0; msgs.push("の身代わりは消えた。"); }
  if(u.perish > 0){ u.perish = 0; msgs.push("は滅びの唄から逃れた。"); }
  u.bond = false;
  return msgs;
}

/* HUDの状態表示 */
function tags(u){
  let h = u.status ? `<span class="st-tag st-${u.status}">${u.status}</span>` : "";
  if(u.seedTurns > 0) h += `<span class="st-tag st-寄生">寄生${u.seedTurns}</span>`;
  if(isBound(u)) h += `<span class="st-tag st-拘束">拘束${u.bindTurns}</span>`;
  if(u.encore)   h += `<span class="st-tag st-幻">反響${u.encore.turns}</span>`;
  if(u.disabled) h += `<span class="st-tag st-幻">封技${u.disabled.turns}</span>`;
  if(u.tauntTurns > 0) h += `<span class="st-tag st-挑発">挑発${u.tauntTurns}</span>`;
  if(u.sub > 0)    h += `<span class="st-tag st-身代">身代${u.sub}</span>`;
  if(u.perish > 0) h += `<span class="st-tag st-滅び">滅び${u.perish}</span>`;
  const lbl = {atk:"攻", def:"防", acc:"命", spd:"速", eva:"回"};
  for(const k in lbl){
    const n = u.rank[k];
    if(n) h += `<span class="rk ${n>0?"up":"dn"}">${lbl[k]}${n>0?"+":""}${n}</span>`;
  }
  return h;
}

/* ダメージ適用。被弾直前のHPを控えておく（護りの札の発動条件に使う） */
/* 直接攻撃以外のダメージ。霊体を持っていれば通らない */
function indirect(u, amount, label){
  if(has(u, "ghost")){ say(`${nm(u)} は霊体で${label}を受けない。`); return 0; }
  hurt(u, amount); return amount;
}

function hurt(u, amount){
  u.preHitHp = u.hp;
  u.hp -= amount;
}

let B = null;

function beginBattle(youTeam, foeTeam, seed, meSide){
  setSeed(seed);
  ME = meSide;
  B = {
    you: youTeam.map(b=>makeUnit(b,"you")),
    foe: foeTeam.map(b=>makeUnit(b,"foe")),
    hazard: {you:{rock:false, sand:false}, foe:{rock:false, sand:false}},
    yi:0, fi:0, turn:1, over:false, busy:false, pickSeq:0
  };
  $("#log").innerHTML = "";
  ["you","foe"].forEach(sd => (sd==="you"?$("#spYou"):$("#spFoe")).classList.remove("faint","enter","hit"));
  show("scBattle");
  say(`<span class="sys">── 相手の手持ち: ${opTeam().map(u=>u.name).join(" / ")}</span>`);
  if(NET.on) say(`<span class="sys">通信対戦（あなたは ${ME==="you"?"ホスト":"ゲスト"}側）</span>`);
  say(`ゆけ、${nm(MY())}！`);
  onEnter(FOE()); onEnter(YOU());
  paint(true); renderCmd();
}

function startBattle(){
  NET.on = false;
  foeParty = randBuild();
  beginBattle(party, foeParty, (Date.now() ^ 0x9e3779b9) >>> 0, "you");
}

/* 内部の陣営は常に「ホスト=you / ゲスト=foe」で固定する。
   両端末が同じ盤面を同じ順序で計算できるようにするため、
   どちらの視点かは ME だけが持ち、表示の反転にしか使わない。 */
let ME = "you";
const YOU = () => B.you[B.yi];
const FOE = () => B.foe[B.fi];
const MY  = () => ME === "you" ? YOU() : FOE();
const OP  = () => ME === "you" ? FOE() : YOU();
const myTeam = () => ME === "you" ? B.you : B.foe;
const opTeam = () => ME === "you" ? B.foe : B.you;
const myIdx  = () => ME === "you" ? B.yi : B.fi;
/* 画面上の位置。自分は常に手前(you枠)、相手は奥(foe枠) */
const screenPos = side => side === ME ? "you" : "foe";
const pfx = u => u.side === ME ? "" : "相手の";
const active = side => side === "you" ? YOU() : FOE();
const sprite = side => screenPos(side) === "you" ? $("#spYou") : $("#spFoe");
/* ログ表示名。同じ種を両者が使っても取り違えないよう、相手側には接頭辞と色をつける */
const nm = u => u.side === ME
  ? `<span class="u-you">${u.name}</span>`
  : `<span class="u-foe">相手の${u.name}</span>`;

function say(h){
  const l = $("#log");
  l.appendChild(el("p",null,h));
  l.scrollTop = l.scrollHeight;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function paint(enter){
  const y = MY(), f = OP();
  drawSprite($("#spYou"), y.id, "back"); drawSprite($("#spFoe"), f.id);
  if(enter){
    [[y.side,y],[f.side,f]].forEach(([s,u])=>{
      if(u.dead) return;                       // 伏せたままの枠は登場させない
      sprite(s).classList.add("enter");
      setTimeout(()=>sprite(s).classList.remove("enter"), 320);
    });
  }
  $("#youName").innerHTML = `${y.name} ${chip(y.type)}`;
  $("#foeName").innerHTML = `<span class="pfx">相手の</span>${f.name} ${chip(f.type)}`;
  $("#youTags").innerHTML = tags(y);
  $("#foeTags").innerHTML = tags(f);
  const yp = Math.max(0,y.hp/y.maxhp), fp = Math.max(0,f.hp/f.maxhp);
  $("#youHp").style.width = (yp*100)+"%";
  $("#foeHp").style.width = (fp*100)+"%";
  $("#youEn").style.width = (y.en/y.maxen*100)+"%";
  $("#youHp").style.background = yp<.25?"var(--red)":yp<.5?"var(--gold)":"var(--green)";
  $("#foeHp").style.background = fp<.25?"var(--red)":fp<.5?"var(--gold)":"var(--green)";
  $("#youHpV").textContent = `HP ${Math.max(0,Math.ceil(y.hp))}/${y.maxhp}  気力 ${Math.floor(y.en)}`;
  $("#foeHpV").textContent = `HP ${Math.max(0,Math.ceil(f.hp))}/${f.maxhp}`;
  $("#youEq").innerHTML = eqLine(y);
  $("#foeEq").innerHTML = eqLine(f);
  renderTeams(); renderStrip();
}

const eqLine = u =>
  (abilOff(u) ? `<span class="no">✦ ${ABILITIES[u.ability].n}（無効）</span>` : `✦ ${ABILITIES[u.ability].n}`)
  + (u.equip === "none" ? ' <span class="no">/ 持ち物なし</span>' : ` / ◈ ${EQUIPS[u.equip].n}`);

/* 両陣営の手持ちと持ち物の一覧 */
/* 6体の状態を常に見える形で出す */
function renderStrip(){
  const box = $("#strip");
  if(!box) return;
  const cell = (u, act) => {
    const pct = Math.max(0, u.hp/u.maxhp);
    const col = u.dead ? "#3a4266" : pct<.25 ? "var(--red)" : pct<.5 ? "var(--gold)" : "var(--green)";
    const marks = (u.status?`<i class="mk s">${u.status[0]}</i>`:"")
      + (u.sub>0?'<i class="mk b">代</i>':"")
      + (u.perish>0?`<i class="mk p">${u.perish}</i>`:"")
      + (isBound(u)?'<i class="mk w">縛</i>':"")
      + (u.encore||u.disabled||u.tauntTurns>0?'<i class="mk r">封</i>':"");
    return `<div class="cell${act?" act":""}${u.dead?" out":""}">
      <div class="cn">${u.name}${chip(u.type)}</div>
      <div class="cbar"><i style="width:${pct*100}%;background:${col}"></i></div>
      <div class="cft">${u.dead?"戦闘不能":Math.ceil(u.hp)+"/"+u.maxhp}<span class="mks">${marks}</span></div>
    </div>`;
  };
  box.innerHTML =
    `<div class="srow"><span class="slb w-foe">あいて</span>${opTeam().map(u=>cell(u,u===OP())).join("")}</div>
     <div class="srow"><span class="slb w-you">じぶん</span>${myTeam().map(u=>cell(u,u===MY())).join("")}</div>`;
}

function renderTeams(){
  const box = $("#teamBox");
  if(!box) return;
  const row = (u, isAct, sideLbl, cls) => {
    const ab = abilOff(u)
      ? `<span class="no">✦ ${ABILITIES[u.ability].n}（無効）</span><i>無垢の仮面で封じられている</i>`
      : `✦ ${ABILITIES[u.ability].n}<i>${ABILITIES[u.ability].d}</i>`;
    const eq = u.equip === "none"
      ? '<span class="no">持ち物なし</span>'
      : `◈ ${EQUIPS[u.equip].n}<i>${EQUIPS[u.equip].d}</i>`;
    const st = u.dead ? "戦闘不能"
      : `HP ${Math.max(0,Math.ceil(u.hp))}/${u.maxhp}${u.status?" ・"+u.status:""}${u.seedTurns>0?" ・寄生"+u.seedTurns:""}`;
    return `<div class="trow${u.dead?" out":""}${isAct&&!u.dead?" act":""}">
      <span class="who ${cls}">${sideLbl}</span>
      <span class="nmx">${u.name}</span>${chip(u.type)}
      <span class="mvd" style="font-family:var(--mono);font-size:9.5px;color:var(--dim)">${st}</span>
      <span class="eq">${ab}${eq}</span></div>`;
  };
  const hzLine = (side, lbl, cls) => {
    const hz = B.hazard[side];
    const on = Object.keys(hz).filter(k=>hz[k]).map(k=>HAZARD_NAME[k]);
    return `<div class="trow"><span class="who ${cls}">${lbl}</span>
      <span class="mvd" style="font-family:var(--mono);font-size:9.5px;color:${on.length?"#f0937d":"var(--dim)"}">
      足元: ${on.length ? on.join(" / ") : "なし"}</span></div>`;
  };
  let h = '<div class="team">';
  h += hzLine(ME,"じぶん","w-you") + hzLine(ME==="you"?"foe":"you","あいて","w-foe");
  myTeam().forEach(u => h += row(u, u===MY(), "じぶん", "w-you"));
  opTeam().forEach(u => h += row(u, u===OP(), "あいて", "w-foe"));
  box.innerHTML = h + "</div>";
}

function renderCmd(){
  const y = MY(), f = OP(), box = $("#cmd");
  box.innerHTML = "";
  let anyMove = false;
  y.moves.forEach(k=>{
    const m = MOVES[k];
    const e = m.p>0 ? eff(m.t, f.type) : 1;
    const pr = m.pri || 0;
    const prTag = pr > 0 ? `<span class="eff pri">先制+${pr}</span>`
                : pr < 0 ? `<span class="eff late">後攻${pr}</span>` : "";
    const stab = m.p>0 && m.t === y.type && e>0 ? '<span class="eff st">一致</span>' : "";
    const tag = prTag + stab + (
                m.p===0 && fxNullified(m, f) ? '<span class="eff no">効果なし</span>'
              : m.p>0 && e===0 ? '<span class="eff no">効果なし</span>'
              : m.p>0 && e>1   ? '<span class="eff up">ばつぐん</span>'
              : m.p>0 && e<1   ? '<span class="eff dn">いまひとつ</span>' : "");
    const cost = enCost(y, k);
    const lockMsg = moveLock(y, k);
    const blocked = !!lockMsg;
    const costTxt = blocked
      ? lockMsg
      : (cost > m.en ? `気力 ${cost}（連続${y.guardStreak+1}回目）` : `気力 ${cost}`);
    const info = blocked ? `<span class="lockmsg">${costTxt}</span>`
      : `<span class="mvd">${m.p>0 ? `威力 ${m.p}　${costTxt}${m.acc&&m.acc<100?`　命中 ${m.acc}`:""}`
                                  : `${costTxt}${m.acc&&m.acc<100?`　命中 ${m.acc}`:""}`}</span>`
        + (m.d ? `<span class="mvx">${m.d}</span>` : "");
    const b = el("button",null,
      `<span class="mv"><span class="mvn">${chip(m.t)} ${m.n}${blocked?"":tag}</span>${info}</span>`);
    b.disabled = blocked || y.en < cost || B.busy;
    if(!b.disabled) anyMove = true;
    b.onclick = ()=> resolve({kind:"move",key:k});
    box.appendChild(b);
  });

  if(y.encore){
    // 反響中は技が強制される。溜めることもできず、出せなければ不発
    const k = y.encore.key;
    if(!anyMove){
      const b = el("button","wide",
        `<span class="mv"><span class="mvn">行動できない</span>
         <span class="mvd">反響で ${MOVES[k].n} を強制されているが出せない ・ このターンは不発</span></span>`);
      b.disabled = B.busy;
      b.onclick = ()=> resolve({kind:"move",key:k});
      box.appendChild(b);
    }
  } else {
    // 攻撃せず気力を溜める選択肢
    const full = y.en >= y.maxen;
    const b = el("button","wide",
      `<span class="mv"><span class="mvn">気を溜める</span>
       <span class="mvd">${anyMove ? "" : "出せる技がない ・ "}攻撃しない代わりに気力 +${EN_FOCUS}${full ? "（すでに満タン）" : ""} ・ ターン終了時の回復とは別</span></span>`);
    b.disabled = B.busy;
    b.onclick = ()=> resolve({kind:"move",key:null});
    box.appendChild(b);
  }
  const bench = $("#bench"); bench.innerHTML = "";
  myTeam().forEach((u,i)=>{
    if(i===myIdx()) return;
    const bound = isBound(y);
    const b = el("button",null, u.dead ? `${u.name}<span class="d">戦闘不能</span>`
      : bound ? `${u.name} に交代<span class="d">渦に巻かれていて交代できない（あと${y.bindTurns}ターン）</span>`
      : `<span class="bn">${chip(u.type)} ${u.name} に交代</span><span class="d">HP ${Math.ceil(u.hp)}/${u.maxhp}　気力 ${Math.floor(u.en)}</span><span class="d">${eqLine(u)}</span>`);
    b.disabled = u.dead || bound || B.busy;
    b.onclick = ()=> resolve({kind:"switch",to:i});
    bench.appendChild(b);
  });
}
function lockCmd(){ B.busy=true; renderCmd(); }

/* ---- damage ---- */
function damage(att, def, m){
  let base = Math.floor(Math.floor(22 * m.p * ATK(att) / DEF(def)) / 55) + 2;
  let e = eff(m.t, def.type);
  if(e > 0 && e < 1 && def.equip === "ward") e = 0.75;   // 無効(0)は緩和しない
  const crit = rng() < 0.0625;
  if(e === 0) return {dmg:0, e:0, crit:false, stab:false};
  const stab = m.t === att.type;                 // 自分のタイプの技は1.5倍
  let d = base * e * (stab?1.5:1) * (crit?1.5:1) * (0.85 + rng()*0.15);
  if(hasVs(def,"ballast",att) && SPD(att) > SPD(def)) d *= 0.8;   // 重心
  if(hasVs(def,"hide",att) && e > 1) d *= 0.85;                    // 岩肌
  if(def.guarding) d *= 0.2;
  return {dmg:Math.max(1,Math.floor(d)), e, crit, stab};
}

}

function spark(side, type, n){
  const st = $("#stage"), f = FX[type] || FX.無, pos = FX_POS[screenPos(side)];

    const p = el("div","pt");

    p.style.background = f.col[i % f.col.length];
    p.style.left = pos.x+"%"; p.style.top = pos.y+"%";
    p.style.animationDelay = Math.floor(rng()*110)+"ms";
    st.appendChild(p);
    setTimeout(()=>p.remove(), 800);

/* 技を撃ったときの一連の演出。kind: attack / status / heal / miss */
function playFx(u, target, m, kind){
  const t = m.t, f = FX[t] || FX.無;
  if(kind === "attack"){
    lunge(u.side);
    if(f.flash) screenFlash(f.flash);
    if(f.shake) shakeStage();
    if(f.bolt)  boltAt(target.side);
    if(f.streak) streaks(target.side);
    if(f.ring)  ringAt(target.side, f.ring);
    setTimeout(()=> spark(target.side, t, m.p >= 100 ? 16 : m.p >= 70 ? 12 : 8), 130);
  } else if(kind === "status"){
    ringAt(u.side, f.col[0]);
    spark(u.side, t, 7);
  } else if(kind === "heal"){
    const st = $("#stage"), pos = FX_POS[screenPos(u.side)];
    for(let i=0;i<9;i++){
      const p = el("div","pt heal");
      p.style.left = (pos.x - 7 + rng()*14)+"%";
      p.style.top  = (pos.y + 6)+"%";
      p.style.animationDelay = Math.floor(rng()*220)+"ms";
      st.appendChild(p); setTimeout(()=>p.remove(), 1000);
